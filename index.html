/* Itineraries (root list) */
class TripsView extends View {
  constructor(app,p){ super(app,p); this.title='Itineraries'; this.tab=null; this.showBack=false; }
  render(){
    const cards = this.app.store.list().map(t => `
      <div class="trip-card has-menu" data-id="${esc(t.id)}">
        <a class="trip-card-link" href="#/trip/${esc(t.id)}/overview">
          <div class="eyebrow">${esc(t.tagline||'Trip')}</div>
          <h2>${esc(t.name)}</h2>
          <div class="tc-sub">${this.app.fmtRange(t)} · ${t.dayCount} days · ${t.travelers||1} travellers</div>
          <span class="tc-go">›</span>
        </a>
        <button class="card-menu" data-menu="${esc(t.id)}" aria-label="Trip options">⋯</button>
      </div>`).join('');
    return `<div class="row between" style="align-items:flex-end;margin-bottom:18px">
        <div><div class="eyebrow">Your journeys</div><div class="display">Itineraries</div></div>
        <div class="list-head-actions">
          <button class="icon-btn" id="importTripBtn" aria-label="Import itinerary" title="Import">${svg('download')}</button>
          <button class="icon-btn primary" id="newTripBtn" aria-label="New itinerary" title="New trip">＋</button>
        </div>
      </div>
      <div class="stagger" style="display:grid;gap:14px">${cards || this._empty()}</div>`;
  }
  _empty(){ return `<div class="empty"><div class="e-ico">${svg('briefcase')}</div><h3>No trips yet</h3><p>Use New trip to create one, or Import to load a JSON.</p></div>`; }
  mount(){
    $('#newTripBtn',this.el).addEventListener('click', ()=>this.app.openTripForm(null, id=>this.app.router.go('/trip/'+id+'/overview')));
    $('#importTripBtn',this.el).addEventListener('click', ()=>this.app.openImport(id=>{ if(id) this.app.router.go('/trip/'+id+'/overview'); else this.app.router.resolve(); }));
    this.el.addEventListener('click', e=>{
      const m=e.target.closest('[data-menu]'); if(!m) return;
      e.preventDefault(); e.stopPropagation();
      const trip=this.app.store.get(m.dataset.menu); if(trip) this.app.openTripMenu(trip);
    });
  }
}

/* Overview */
class OverviewView extends View {
  constructor(app,p){ super(app,p); this.trip = app.store.get(p.id); this.title = this.trip ? this.trip.name : 'Trip'; this.tab='overview'; this.showBack=true; this.back='/trips'; }
  render(){
    const t = this.trip; if(!t) return this.app.notFound();
    const ph = t.phase;
    let badge;
    if(ph.state==='before') badge = `<div class="count-badge"><div class="cb-num">${ph.n}</div><div class="cb-lbl">${ph.n===1?'day to go':'days to go'}</div></div>`;
    else if(ph.state==='during') badge = `<div class="count-badge live"><div class="cb-num">${ph.n+1}</div><div class="cb-lbl">of ${t.dayCount}</div></div>`;
    else badge = `<div class="count-badge"><div class="cb-num">✓</div><div class="cb-lbl">complete</div></div>`;
    const pills = (t.tags || ['🏔 Alps + Lakes']);
    const heroPills = [`<span class="chip">${svg('calendar')} ${t.dayCount} days</span>`,`<span class="chip">${svg('users')} ${t.travelers||1} travellers</span>`,`<span class="chip">${esc(t.tagline||'Trip')}</span>`].join('');

    // budget
    const exp = this.app.expensesFor(t.id);
    const spent = this.app.spentHome(t, exp);
    const budget = t.budget || 0;
    const pct = budget ? Math.min(100, Math.round(spent/budget*100)) : 0;
    const budgetCard = budget ? `
      <div class="card pad" style="margin-top:14px">
        <div class="row between"><div class="eyebrow">Budget</div><div class="muted" style="font-size:12px">${pct}% used</div></div>
        <div class="row between" style="margin:6px 0 9px"><strong style="font-size:20px;font-family:'DM Sans',system-ui,sans-serif;color:var(--navy-text)">${fmtMoney(spent,t.homeCurrency)}</strong><span class="muted" style="font-size:13px">of ${fmtMoney(budget,t.homeCurrency)}</span></div>
        <div class="meter"><i style="width:${pct}%"></i></div>
      </div>` : '';

    // up next
    let nextIdx = ph.state==='before' ? 0 : ph.state==='during' ? ph.n : -1;
    let nextCard = '';
    if(nextIdx >= 0 && t.days[nextIdx]){
      const d = t.days[nextIdx];
      nextCard = `<div class="section-head"><h2>${ph.state==='during'?'Today':'Up next'}</h2><a class="link" href="#/trip/${esc(t.id)}/days">All days ›</a></div>
        <a class="day-row" href="#/trip/${esc(t.id)}/day/${nextIdx+1}">
          <div class="day-num">${nextIdx+1}</div>
          <div class="dr-body"><div class="dr-date">${this.app.dateLabel(t,nextIdx)}</div><div class="dr-title">${esc(d.title)}</div>
          <div class="dr-tags">${(d.tags||[]).slice(0,3).map(x=>`<span>${esc(x)}</span>`).join('')}</div></div>
          <div class="dr-chev">›</div></a>`;
    }

    // Pre-Departure entry — kept because it isn't in the bottom tab bar (the old
    // 'Plan' tile grid duplicated tabs we already have, so it was dropped).
    const base = `#/trip/${esc(t.id)}`;
    const prep = (Array.isArray(t.prep) && t.prep.length) ? `<div class="section-head"><h2>Before you go</h2></div>
      <div class="tiles"><a class="tile" style="grid-column:1/-1" href="${base}/prep"><div class="tile-ico">${svg('briefcase')}</div><div class="tile-title">Pre-Departure</div><div class="tile-sub">Packing &amp; documents checklist</div></a></div>` : '';

    // hotels + book-in-advance chips, both driven by the trip's own data
    let extras = '';
    const hotels = Array.isArray(t.hotels) ? t.hotels : [];
    if(hotels.length){
      extras += `<div class="section-head"><h2>Your Hotels</h2></div><div class="stagger" style="display:grid;gap:10px">` +
        hotels.map(ho=>`<div class="card pad">${ho.nights?`<div class="eyebrow">${esc(ho.nights)}</div>`:''}
          <div style="font-family:'DM Sans',system-ui,sans-serif;font-size:20px;font-weight:600;color:var(--navy-text);margin-top:2px">${esc(ho.name)}</div>
          ${ho.loc?`<div class="muted" style="font-size:13px">${esc(ho.loc)}</div>`:''}
          ${ho.url?`<a class="btn ghost" style="margin-top:10px" href="${esc(ho.url)}" target="_blank" rel="noopener">Book / View</a>`:''}</div>`).join('') + `</div>`;
    }
    const bookings = Array.isArray(t.bookings) ? t.bookings : [];
    if(bookings.length){
      extras += `<div class="section-head"><h2>Book in Advance</h2></div><div class="book-grid stagger">` +
        bookings.map(b=>`<a class="book-card" href="${esc(b.url)}" target="_blank" rel="noopener">
          <div class="bk-ic">${esc(b.ico||'🎟')}</div>
          <div class="bk-body"><div class="bk-label">${esc(b.label)}</div><div class="bk-sub">Book ↗</div></div></a>`).join('') + `</div>`;
    }

    return `<div class="hero-card view-anim-fade">
        <div class="hero-top">
          <div class="hero-head">
            <div class="eyebrow">${ph.state==='after'?'Trip complete':ph.state==='during'?'On trip now':'Upcoming trip'}</div>
            <h1>${esc(t.name)}</h1>
          </div>
          ${badge}
        </div>
        <div class="hero-sub">${this.app.fmtRange(t)}</div>
        <div class="hero-pills">${heroPills}</div>
      </div>
      ${nextCard}
      ${budgetCard}
      ${prep}
      ${extras}`;
  }
}

/* Days list */
class DaysView extends View {
  constructor(app,p){ super(app,p); this.trip = app.store.get(p.id); this.title='Day by Day'; this.tab='days'; this.showBack=true; this.back='/trip/'+p.id+'/overview';
    app.clearLastDay(p.id); } // on the index, no specific day is pinned
  render(){
    const t = this.trip; if(!t) return this.app.notFound();
    const ti = t.todayIndex;
    const rows = t.days.map((d,i)=>{
      const cls = i===ti ? ' today' : (i<ti ? ' past' : '');
      const flag = i===ti ? '<span class="pill-today">Today</span>' : '';
      return `<a class="day-row${cls}" href="#/trip/${esc(t.id)}/day/${i+1}">
        <div class="day-num">${i+1}</div>
        <div class="dr-body">
          <div class="dr-date">${this.app.dateLabel(t,i)}${flag}</div>
          <div class="dr-title">${esc(d.title)}</div>
          <div class="dr-tags">${(d.tags||[]).slice(0,3).map(x=>`<span>${esc(x)}</span>`).join('')}</div>
        </div><div class="dr-chev">›</div></a>`;
    }).join('');
    return `<div class="row between" style="align-items:flex-end;margin-bottom:16px">
        <div><div class="eyebrow">${esc(t.name)}</div><div class="display">Day by Day</div></div>
        <button class="icon-btn primary" id="addDayBtn" aria-label="Add day" title="Add day">＋</button>
      </div>
      <div style="display:grid;gap:11px">${rows || this.app.emptyDays(t)}</div>`;
  }
  mount(){
    const b=$('#addDayBtn',this.el);
    b && b.addEventListener('click', ()=>this.app.openDayForm(this.trip, null, idx=>{ this.app.router.resolve(); }));
  }
}

/* Day detail */
class DayDetailView extends View {
  constructor(app,p){ super(app,p); this.trip = app.store.get(p.id); this.idx = (parseInt(p.n,10)||1) - 1; this.title='Day '+(this.idx+1); this.tab='days'; this.showBack=true; this.back='/trip/'+p.id+'/days'; this.edit=false;
    if(this.trip && this.trip.days[this.idx]) app.setLastDay(p.id, this.idx); }
  render(){
    const t = this.trip; if(!t || !t.days[this.idx]) return this.app.notFound();
    const i = this.idx, d = t.days[i], ed = this.edit;
    const tl = d.timeline.map((s,j)=>{
      const label = s.placeQuery ? `<a class="dest" href="${gmaps(s.placeQuery)}" target="_blank" rel="noopener">${esc(s.label)}</a>` : esc(s.label);
      const note = s.note ? `<div class="tl-note">${esc(s.note)}</div>` : '';
      const book = s.bookLink ? `<a class="booknow" href="${esc(s.bookLink.url)}" target="_blank" rel="noopener">${svg('ticket')} ${esc(s.bookLink.label)}</a>` : '';
      const editBtns = ed ? `<div class="stop-edit"><button class="mini-btn" data-edit-stop="${j}">Edit</button><button class="mini-btn del" data-del-stop="${j}">Delete</button></div>` : '';
      return `<div class="tl-item ${esc(s.kind||'normal')}">
        <div class="tl-time">${esc(s.time||'')}</div><div class="tl-dot"></div>
        <div class="tl-body"><div class="tl-label">${label}</div>${note}${book}${this._pills(s.stopInfo)}${editBtns}</div></div>`;
    }).join('');
    const addStop = ed ? `<button class="add-stop-btn" id="addStopBtn">＋ Add stop</button>` : '';

    // cost row — shown when the day declares a `costs` array (per-person amounts in baseCurrency)
    let cost = '';
    if(Array.isArray(d.costs)){
      const items = d.costs;
      const cur = t.baseCurrency || 'CHF';
      const ppl = t.travelers || 1;
      if(items.length){
        const total = items.reduce((a,x)=>a + (Number(x.c)||0)*ppl, 0);
        const home = this.app.fx.convert(total, cur, t.homeCurrency);
        const homeStr = (home!=null && t.homeCurrency && t.homeCurrency!==cur) ? ` <span class="muted" style="font-weight:400;font-size:11px">≈ ${Math.round(home)} ${esc(t.homeCurrency)}</span>` : '';
        cost = `<div class="block"><h4>Day cost · ${ppl} ${ppl===1?'person':'people'}</h4><div class="cost-row"><span class="cost-bits">${items.map(x=>esc(x.n)).join(' · ')}</span><strong>${esc(cur)} ${total.toFixed(0)}${homeStr}</strong></div></div>`;
      } else {
        cost = `<div class="block"><h4>Day cost</h4><div class="cost-row"><span class="cost-bits">No paid attractions today</span><strong>—</strong></div></div>`;
      }
    }

    // checklist
    let check = '';
    const checklist = Array.isArray(d.checklist) ? d.checklist : [];
    if(checklist.length){
      const saved = Storage.getJSON('chk_'+t.id+'_'+i, []);
      check = `<div class="block"><h4>Checklist</h4><div id="dayChecklist">` +
        checklist.map((c,k)=>`<label class="check-row${saved.includes(k)?' done':''}" data-k="${k}"><input type="checkbox" ${saved.includes(k)?'checked':''}><span class="ct">${esc(c)}</span></label>`).join('') +
        `</div><div class="muted" style="font-size:10.5px;margin-top:6px">Saved on this device only</div></div>`;
    }

    const driveBtn = d.routeMapUrl ? `<a class="btn" href="${esc(d.routeMapUrl)}" target="_blank" rel="noopener">${svg('compass')} Driving route</a>` : '';
    const hasGeo = d.timeline.some(s=>typeof s.lat==='number' && typeof s.lon==='number');
    const stopsBtn = hasGeo ? `<a class="btn ghost" href="#/trip/${esc(t.id)}/map/${i+1}">${svg('map')} This day's stops</a>` : '';
    const route = (driveBtn||stopsBtn) ? `<div class="btn-row">${driveBtn}${stopsBtn}</div>` : '';

    // prev/next
    const prev = i>0 ? `<a href="#/trip/${esc(t.id)}/day/${i}"><div class="nav-card"><div class="nc-lbl">‹ Day ${i}</div><div class="nc-title">${esc(t.days[i-1].title)}</div></div></a>` : '<span style="flex:1"></span>';
    const next = i<t.dayCount-1 ? `<a href="#/trip/${esc(t.id)}/day/${i+2}"><div class="nav-card next"><div class="nc-lbl">Day ${i+2} ›</div><div class="nc-title">${esc(t.days[i+1].title)}</div></div></a>` : '<span style="flex:1"></span>';

    const editToolbar = ed ? `<div class="edit-toolbar">
        <button class="btn sm" id="editDayBtn">${svg('pencil')} Edit day details</button>
        <button class="btn sm" id="dayJsonBtn">${svg('code')} Edit JSON</button>
        <button class="btn sm danger" id="delDayBtn">${svg('trash')} Delete day</button>
      </div>` : '';

    return `<div class="detail-head">
        <div class="row between">
          <div class="eyebrow">${this.app.dateLabel(t,i)} · Day ${i+1} of ${t.dayCount}</div>
          <button class="icon-btn${ed?' primary':''}" id="editToggle" aria-label="${ed?'Done editing':'Edit day'}" title="${ed?'Done':'Edit day'}">${svg('pencil')}</button>
        </div>
        <h1>${esc(d.title)}</h1>
        <div class="detail-tags">${(d.tags||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>
      </div>
      ${editToolbar}
      ${route}
      <div class="timeline">${tl}</div>
      ${addStop}
      ${cost}${check}
      <div class="detail-nav">${prev}${next}</div>`;
  }
  _rerender(){ this.el.innerHTML = this.render(); this.mount(); }
  _pills(p){
    if(!p) return '';
    const out=[];
    if(p.parking) out.push(`<div class="info-line parking"><span class="ico">${svg('parking')}</span><span>${esc(p.parking)}</span></div>`);
    if(p.fee!==undefined){
      const cur = (this.trip && this.trip.baseCurrency) || 'CHF';
      if(p.fee===0) out.push(`<div class="info-line fee free"><span class="ico">${svg('coin')}</span><span>Free</span></div>`);
      else if(typeof p.fee==='object') out.push(`<div class="info-line fee"><span class="ico">${svg('coin')}</span><span><strong>${cur} ${p.fee.chf}</strong> · ${esc(p.fee.note)}</span></div>`);
      else out.push(`<div class="info-line fee"><span class="ico">${svg('coin')}</span><span><strong>${cur} ${p.fee}</strong></span></div>`);
    }
    if(p.duration) out.push(`<div class="info-line"><span class="ico">${svg('clock')}</span><span>${esc(p.duration)}</span></div>`);
    if(p.hours) out.push(`<div class="info-line"><span class="ico">${svg('clock')}</span><span>${esc(p.hours)}</span></div>`);
    if(p.tip) out.push(`<div class="info-line tip"><span class="ico">${svg('bulb')}</span><span>${esc(p.tip)}</span></div>`);
    return out.length ? `<div class="stop-info">${out.join('')}</div>` : '';
  }
  mount(){
    const box = $('#dayChecklist', this.el);
    if(box) box.addEventListener('change', e=>{
      const row = e.target.closest('.check-row'); if(!row) return;
      const k = +row.dataset.k, key = 'chk_'+this.trip.id+'_'+this.idx;
      const saved = Storage.getJSON(key, []);
      if(e.target.checked){ if(!saved.includes(k)) saved.push(k); row.classList.add('done'); }
      else { const x=saved.indexOf(k); if(x>=0) saved.splice(x,1); row.classList.remove('done'); }
      Storage.setJSON(key, saved);
    });
    // edit-mode controls
    const toggle=$('#editToggle',this.el);
    toggle && toggle.addEventListener('click', ()=>{ this.edit=!this.edit; this._rerender(); });
    if(!this.edit) return;
    const t=this.trip;
    const editDay=$('#editDayBtn',this.el);
    editDay && editDay.addEventListener('click', ()=>this.app.openDayForm(t, this.idx, res=>{
      if(res==='deleted'){ this.app.router.go('/trip/'+t.id+'/days'); return; }
      this.trip=this.app.store.get(t.id); this._rerender();
    }));
    const dayJson=$('#dayJsonBtn',this.el);
    dayJson && dayJson.addEventListener('click', ()=>this.app.openDayJsonEditor(t, this.idx, ()=>{
      this.trip=this.app.store.get(t.id); this._rerender();
    }));
    const delDay=$('#delDayBtn',this.el);
    delDay && delDay.addEventListener('click', ()=>{
      if(!confirm('Delete day '+(this.idx+1)+'?')) return;
      this.app.store.trips[t.id].days.splice(this.idx,1); this.app.store.save();
      toast('Day deleted'); this.app.router.go('/trip/'+t.id+'/days');
    });
    const addStop=$('#addStopBtn',this.el);
    addStop && addStop.addEventListener('click', ()=>this.app.openStopForm(t, this.idx, null, ()=>{ this.trip=this.app.store.get(t.id); this._rerender(); }));
    // delegated stop edit/delete — attach to the persistent element once
    if(!this._delegated){
      this._delegated=true;
      this.el.addEventListener('click', e=>{
        if(!this.edit) return;
        const tt=this.trip;
        const ed=e.target.closest('[data-edit-stop]');
        if(ed){ this.app.openStopForm(tt, this.idx, +ed.dataset.editStop, ()=>{ this.trip=this.app.store.get(tt.id); this._rerender(); }); return; }
        const dl=e.target.closest('[data-del-stop]');
        if(dl){ if(!confirm('Delete this stop?')) return;
          this.app.store.trips[tt.id].days[this.idx].timeline.splice(+dl.dataset.delStop,1); this.app.store.save();
          toast('Stop deleted'); this.trip=this.app.store.get(tt.id); this._rerender(); }
      });
    }
  }
}

/* Map */
class MapView extends View {
  constructor(app,p){ super(app,p); this.trip = app.store.get(p.id); this.tab='map'; this.showBack=true;
    this.focus = (p.n!=null) ? ((parseInt(p.n,10)||1)-1) : null;
    this.title = this.focus!=null ? ('Day '+(this.focus+1)+' · Map') : 'Route Map';
    this.back = this.focus!=null ? ('/trip/'+p.id+'/day/'+(this.focus+1)) : ('/trip/'+p.id+'/overview');
    if(this.focus!=null && this.trip && this.trip.days[this.focus]) app.setLastDay(p.id, this.focus);
    else if(this.focus==null) app.clearLastDay(p.id); // full route view pins no day
  }
  /* Stops of day f that carry coordinates (stop.lat/lon). */
  _dayStops(f){
    const t=this.trip, d=t.days[f]; if(!d) return [];
    return d.timeline.map(s=>{
      return (typeof s.lat==='number' && typeof s.lon==='number')
        ? { lat:s.lat, lon:s.lon, time:s.time, label:s.label, kind:s.kind } : null;
    }).filter(Boolean);
  }
  /* One representative point for day f (for the whole-trip overview).
     Prefer the day's own centre (lat/lon/town), else fall back to its first located stop. */
  _dayPoint(f){
    const t=this.trip, d=t.days[f];
    if(d && typeof d.lat==='number' && typeof d.lon==='number') return { lat:d.lat, lon:d.lon, town:d.town||'' };
    const s=this._dayStops(f)[0];
    return s ? { lat:s.lat, lon:s.lon, town:(d && d.town)||'' } : null;
  }
  _mappableDays(){ return this.trip.days.map((d,i)=>this._dayPoint(i)?i:-1).filter(i=>i>=0); }
  render(){
    const t=this.trip; if(!t) return this.app.notFound();
    if(!this._mappableDays().length) return `<div class="empty"><div class="e-ico">${svg('map')}</div><h3>No map for this trip</h3><p>Add coordinates to the stops (the AI prompt can include them) to see them here.</p></div>`;
    const f=this.focus;
    const town = f!=null ? (this._dayPoint(f)?this._dayPoint(f).town:'') : '';
    const heading = f!=null
      ? `<div class="eyebrow">${esc(town)}</div><div class="display" style="margin-bottom:10px">Day ${f+1} · stops</div>`
      : `<div class="eyebrow">${esc(t.name)}</div><div class="display" style="margin-bottom:10px">Full route</div>`;
    const chips = t.days.map((d,i)=>this._dayPoint(i)
      ? `<a class="map-chip${i===f?' on':''}" href="#/trip/${esc(t.id)}/map/${i+1}">${i+1}</a>` : '').join('')
      + `<a class="map-chip${f==null?' on':''}" href="#/trip/${esc(t.id)}/map" style="width:auto;padding:0 12px">All</a>`;
    return `<div class="map-view">${heading}
      <div class="map-chips">${chips}</div>
      <div id="mapEl"></div>
      <div class="map-legend" id="mapLegend"></div></div>`;
  }
  mount(){
    const t=this.trip; const el=$('#mapEl', this.el); if(!el || !this._mappableDays().length) return;
    const f=this.focus;
    this.app.loadLeaflet()
      .then(L=> f!=null ? this._mountDay(L,el,f) : this._mountAll(L,el))
      .catch(()=>{ el.innerHTML = `<div class="empty"><div class="e-ico">${svg('offline')}</div><h3>Map needs a connection</h3><p>Tiles couldn't load offline.</p></div>`; });
  }
  _tiles(L,map){ L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map); }
  /* Whole-trip overview: one pin per day, connected. */
  _mountAll(L,el){
    const t=this.trip;
    const all = t.days.map((d,i)=>{ const p=this._dayPoint(i); return p?{...p,i}:null; }).filter(Boolean);
    const latlngs = all.map(p=>[p.lat,p.lon]);
    const map = L.map(el,{scrollWheelZoom:false}); this._tiles(L,map);
    L.polyline(latlngs,{color:'#C8102E',weight:3,opacity:.65,dashArray:'6 7'}).addTo(map);
    all.forEach(p=>{
      const icon = L.divIcon({className:'',html:`<div class="map-pin"><span>${p.i+1}</span></div>`,iconSize:[30,30],iconAnchor:[15,30],popupAnchor:[0,-28]});
      L.marker([p.lat,p.lon],{icon}).addTo(map).bindPopup(`<b>Day ${p.i+1}${p.town?' · '+esc(p.town):''}</b><br>${esc(t.days[p.i].title)}`);
    });
    map.fitBounds(latlngs,{padding:[44,44]});
    const lg=$('#mapLegend',this.el); if(lg) lg.innerHTML = `Tap a day above to see that day's stops in detail.`;
    this._map = map; setTimeout(()=>map.invalidateSize(), 160);
  }
  /* Single day: every located stop, numbered in order and connected. */
  _mountDay(L,el,f){
    const stops = this._dayStops(f);
    const map = L.map(el,{scrollWheelZoom:false}); this._tiles(L,map);
    if(!stops.length){
      const p=this._dayPoint(f);
      if(p) map.setView([p.lat,p.lon],12); else map.setView([46.8,8.2],7);
      const lg=$('#mapLegend',this.el); if(lg) lg.innerHTML = `No mappable stops for this day.`;
      this._map=map; setTimeout(()=>map.invalidateSize(),160); return;
    }
    const latlngs = stops.map(s=>[s.lat,s.lon]);
    L.polyline(latlngs,{color:'#C8102E',weight:3.5,opacity:.8}).addTo(map);
    let first=null;
    stops.forEach((s,n)=>{
      const icon = L.divIcon({className:'',html:`<div class="map-pin"><span>${n+1}</span></div>`,iconSize:[30,30],iconAnchor:[15,30],popupAnchor:[0,-28]});
      const m=L.marker([s.lat,s.lon],{icon}).addTo(map).bindPopup(`<b>${n+1}. ${esc(s.label)}</b>${s.time?'<br>'+esc(s.time):''}`);
      if(n===0) first=m;
    });
    if(stops.length===1) map.setView(latlngs[0],13); else map.fitBounds(latlngs,{padding:[50,50]});
    setTimeout(()=>{ try{ first && first.openPopup(); }catch(e){} }, 240);
    const lg=$('#mapLegend',this.el); if(lg) lg.innerHTML = `<b>${stops.length}</b> stop${stops.length===1?'':'s'} · in visiting order`;
    this._map = map; setTimeout(()=>map.invalidateSize(), 160);
  }
  unmount(){ if(this._map){ try{ this._map.remove(); }catch(e){} this._map=null; } }
}

/* Currency converter */
class CurrencyView extends View {
  constructor(app,p){ super(app,p); this.trip = app.store.get(p.id); this.title='Currency'; this.tab='convert'; this.showBack=true; this.back='/trip/'+p.id+'/overview';
    // Default the converter to this itinerary's own currencies (base → home),
    // remembered per-trip so each itinerary keeps its own last pair.
    this.from = Storage.get('conv_from_'+p.id) || (this.trip ? this.trip.baseCurrency : 'CHF');
    this.to = Storage.get('conv_to_'+p.id) || (this.trip ? this.trip.homeCurrency : 'AED');
    this.amount = '100';
  }
  render(){
    return `<div class="eyebrow">Live exchange</div><div class="display" style="margin-bottom:6px">Converter</div>
      <div class="card pad view-anim-fade">
        <div class="conv-display"><div class="conv-amt" id="convOut">—</div><div class="conv-sub" id="convSub"></div></div>
        <div class="form-row"><label>Amount</label><input id="convAmt" inputmode="decimal" value="${esc(this.amount)}" autocomplete="off"></div>
        <div class="conv-fields">
          <div class="field"><label>From</label><select id="convFrom">${this.app.currencyOptions(this.from)}</select></div>
          <button class="swap-btn" id="convSwap" aria-label="Swap">⇅</button>
          <div class="field"><label>To</label><select id="convTo">${this.app.currencyOptions(this.to)}</select></div>
        </div>
        <div class="keypad" id="convKeys">
          ${['7','8','9','4','5','6','1','2','3','.','0','⌫'].map(k=>`<button class="key${k==='⌫'?' fn':''}" data-k="${k}">${k}</button>`).join('')}
        </div>
        <div class="quick-amts">
          ${['10','50','100','500','1000'].map(q=>`<button class="chip" data-q="${q}">${q}</button>`).join('')}
          <button class="chip" data-q="C" style="color:var(--red)">Clear</button>
        </div>
        <div class="rate-note" id="convRate"></div>
      </div>`;
  }
  mount(){
    this.amtEl=$('#convAmt',this.el); this.outEl=$('#convOut',this.el); this.subEl=$('#convSub',this.el);
    this.rateEl=$('#convRate',this.el); this.fromEl=$('#convFrom',this.el); this.toEl=$('#convTo',this.el);
    const upd=()=>this._update();
    this.amtEl.addEventListener('input', ()=>{ this.amount=this.amtEl.value; upd(); });
    this.fromEl.addEventListener('change', ()=>{ this.from=this.fromEl.value; Storage.set('conv_from_'+this.params.id,this.from); upd(); });
    this.toEl.addEventListener('change', ()=>{ this.to=this.toEl.value; Storage.set('conv_to_'+this.params.id,this.to); upd(); });
    this._turn = 0;
    $('#convSwap',this.el).addEventListener('click', e=>{
      const f=this.from; this.from=this.to; this.to=f;
      this.fromEl.value=this.from; this.toEl.value=this.to;
      Storage.set('conv_from_'+this.params.id,this.from); Storage.set('conv_to_'+this.params.id,this.to);
      this._turn += 180; e.currentTarget.style.transform = 'rotate('+this._turn+'deg)';
      upd();
    });
    $('#convKeys',this.el).addEventListener('click', e=>{
      const b=e.target.closest('.key'); if(!b) return;
      const k=b.dataset.k; let v=this.amount;
      if(k==='⌫') v=v.slice(0,-1);
      else if(k==='.'){ if(!v.includes('.')) v=(v||'0')+'.'; }
      else { if(v==='0') v=k; else v=v+k; }
      this.amount=v; this.amtEl.value=v; upd();
    });
    $$('.quick-amts .chip',this.el).forEach(c=>c.addEventListener('click',()=>{
      const q=c.dataset.q; this.amount = q==='C' ? '' : q; this.amtEl.value=this.amount; upd();
    }));
    this._update();
    // refresh rates then re-render numbers
    this.app.fx.refresh().then(ok=>{ if(ok && this.app.router.current===this) this._update(); });
  }
  _update(){
    const fx=this.app.fx, amt=parseFloat(this.amount)||0;
    const out=fx.convert(amt,this.from,this.to);
    const one=fx.convert(1,this.from,this.to);
    this.outEl.textContent = out==null ? '—' : fmtMoney(out,this.to);
    this.subEl.textContent = `${fmtMoney(amt,this.from)} =`;
    let when='';
    if(fx.fetchedAt){ const d=new Date(fx.fetchedAt); when=' · '+d.getDate()+' '+MO[d.getMonth()]+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
    this.rateEl.textContent = (one==null?'':`1 ${this.from} = ${fmtMoney(one,this.to)} ${this.to}`) + ` · ${fx.live?'live rates':'offline rates'}${when}`;
  }
}

/* Spending tracker */
class SpendView extends View {
  constructor(app,p){ super(app,p); this.trip = app.store.get(p.id); this.title='Spending'; this.tab='spend'; this.showBack=true; this.back='/trip/'+p.id+'/overview'; }
  render(){
    const t=this.trip; if(!t) return this.app.notFound();
    const exp=this.app.expensesFor(t.id);
    const spent=this.app.spentHome(t,exp);
    // categories
    const sums={}; exp.forEach(e=>{ const v=this.app.fx.convert(e.amt,e.cur,t.homeCurrency)||0; sums[e.cat]=(sums[e.cat]||0)+v; });
    const catRows=Object.keys(sums).sort((a,b)=>sums[b]-sums[a]);
    const sorted = exp.slice().sort(this.app._expCmp);
    const list = sorted.length ? sorted.map(e=>{
      const c=CATS[e.cat]||CATS.other;
      const home=this.app.fx.convert(e.amt,e.cur,t.homeCurrency);
      const ds=this.app.fmtDateShort(e.date);
      const parts=[ds, e.cur===t.homeCurrency?c.label:`${c.label} · ${fmtMoney(e.amt,e.cur)}`].filter(Boolean);
      return `<div class="exp-item" data-id="${e.id}"><div class="exp-ico">${svg(c.icon)}</div>
        <div class="exp-main"><div class="exp-note">${esc(e.note||c.label)}</div><div class="exp-meta">${esc(parts.join(' · '))}</div></div>
        <div class="exp-amt">${fmtMoney(home,t.homeCurrency)}</div>
        <button class="exp-del" data-del="${e.id}" aria-label="Delete">×</button></div>`;
    }).join('') : `<div class="empty" style="padding:30px 10px"><div class="e-ico">${svg('card')}</div><h3>No expenses yet</h3><p>Tap + to log your first one.</p></div>`;

    // Category donut: each slice is one spending category, sized by its share of
    // the total. Animates the slices drawing in on a real visit, but renders them
    // already-drawn on a silent in-place refresh (after adding/removing an expense).
    const R=58, SW=14, C=2*Math.PI*R;
    let summary;
    if(spent>0 && catRows.length){
      // Each slice sits in a "slot" sized by its share. We draw a rounded arc
      // centred in the slot, trimmed by GAP so a clean, even gap shows on both
      // sides. GAP must exceed the stroke width or the round caps would touch.
      const single = catRows.length===1;
      const GAP = single ? 0 : SW + 6;
      let acc=0;
      const segs = catRows.map((c,i)=>{
        const frac = sums[c]/spent;
        const slot = frac*C;
        const drawn = single ? C : Math.max(SW*0.2, slot - GAP);
        const start = acc*C + (slot - drawn)/2;
        const dash = `${drawn.toFixed(2)} ${(C-drawn).toFixed(2)}`;
        acc += frac;
        const col = CAT_COLORS[c] || CAT_COLORS.other;
        // Render the final arc in the markup so it looks right even if the JS
        // draw-in animation never runs; mount() rewinds then replays it.
        return `<circle class="d-seg" cx="100" cy="100" r="${R}" stroke="${col}" stroke-dashoffset="${(-start).toFixed(2)}" stroke-dasharray="${dash}" data-dash="${dash}" style="transition-delay:${(i*0.09).toFixed(2)}s"></circle>`;
      }).join('');
      let accB=0;
      const badges = catRows.map(c=>{
        const frac = sums[c]/spent;
        const mid = accB + frac/2; accB += frac;
        const ang = mid*2*Math.PI, s=Math.sin(ang), co=Math.cos(ang);
        // Each badge (neutral icon card + muted amount) sits just outside the ring,
        // anchored on the slice's mid-angle. The amount stacks on the outward side:
        // above the icon for upper-half slices, below it for lower-half slices.
        const Rb = 0.96;              // badge anchor as a fraction of the half-wrap
        const bx=(50+Rb*50*s).toFixed(2), by=(50-Rb*50*co).toFixed(2);
        const upper = co > 0.0001;
        const ic = (CATS[c]||CATS.other).icon;
        const col = CAT_COLORS[c] || CAT_COLORS.other;
        const icEl  = `<span class="db-ic" style="--seg:${col}">${svg(ic)}</span>`;
        const lblEl = `<span class="db-lbl"><b>${t.homeCurrency}</b>${kCompact(sums[c])}</span>`;
        return `<span class="donut-badge" style="left:${bx}%;top:${by}%">${upper?lblEl+icEl:icEl+lblEl}</span>`;
      }).join('');
      const amtHtml = fmtMoney(spent,t.homeCurrency).replace(/(\.\d+)$/, '<span class="dc-dec">$1</span>');
      summary = `<div class="donut-head">
          <div class="dc-eyebrow">Total spend</div>
          <div class="dc-amt">${amtHtml}</div>
        </div>
        <div class="donut-wrap">
          <svg class="donut" viewBox="0 0 200 200" aria-hidden="true">
            <circle class="d-track" cx="100" cy="100" r="${R}"></circle>
            ${segs}
          </svg>
          ${badges}
          <div class="donut-center"><span>Spend</span></div>
        </div>`;
    } else {
      summary = `<div class="eyebrow" style="text-align:center">Total spend</div>
        <div style="font-family:'DM Sans',system-ui,sans-serif;font-size:42px;font-weight:700;color:var(--navy-text);line-height:1;margin:6px 0;text-align:center">${fmtMoney(spent,t.homeCurrency)}</div>`;
    }

    return `<div class="eyebrow">${esc(t.name)}</div><div class="display" style="margin-bottom:8px">Spending</div>
      <div class="card pad spend-summary">
        ${summary}
      </div>
      <div class="section-head"><h2>Expenses</h2><span class="link">${exp.length} item${exp.length===1?'':'s'}</span></div>
      <div class="card pad" id="expList">${list}</div>
      ${exp.length?`<button class="btn ghost block" id="expPdf" style="margin-top:14px">${svg('file')} Export as PDF</button>`:''}
      <button class="fab" id="addExpBtn" aria-label="Add expense">+</button>`;
  }
  mount(){
    // Animate the donut slices drawing in on a real visit (skipped on instant
    // refreshes, where they were rendered already-drawn).
    if(!this.app._instantSpend){
      const segs=this.el.querySelectorAll('.d-seg');
      if(segs.length){
        const C0=(2*Math.PI*58).toFixed(2);
        // Rewind each arc to a dot, commit it with a forced reflow, then release
        // back to the markup's full dash so the CSS transition reliably draws it in.
        segs.forEach(s=>{ s.style.transition='none'; s.style.strokeDasharray='0.01 '+C0; });
        void this.el.offsetWidth;
        requestAnimationFrame(()=>{ segs.forEach(s=>{ s.style.transition=''; s.style.strokeDasharray=s.dataset.dash; }); });
      }
    }
    this.app._instantSpend=false;
    // Adding/removing an expense re-renders in place with no transition and keeps the
    // scroll position, so the list updates instantly instead of animating.
    const refresh=()=>{ this.app._instantSpend=true; this.app.router.resolve({instant:true, keepScroll:true}); };
    // Portal the FAB out to <body>: a transformed ancestor (the swipe animation
    // on .view) becomes the containing block for position:fixed, which would make
    // the button shift during the transition. Keeping it on <body> keeps it steady.
    const fab=$('#addExpBtn',this.el);
    if(fab){ document.body.appendChild(fab); this._fab=fab;
      fab.addEventListener('click', ()=>this.app.openExpenseSheet(this.trip, refresh)); }
    const pdf=$('#expPdf',this.el);
    pdf && pdf.addEventListener('click', ()=>this.app.exportSpendPDF(this.trip));
    const list=$('#expList',this.el);
    list && list.addEventListener('click', e=>{
      const del=e.target.closest('[data-del]');
      if(del){
        const arr=this.app.expensesFor(this.trip.id).filter(x=>x.id!==del.dataset.del);
        this.app.saveExpenses(this.trip.id, arr);
        toast('Expense removed'); refresh(); return;
      }
      const item=e.target.closest('.exp-item'); if(!item) return;
      const ex=this.app.expensesFor(this.trip.id).find(x=>x.id===item.dataset.id);
      if(ex) this.app.openExpenseSheet(this.trip, refresh, ex);
    });
  }
  unmount(){ if(this._fab){ this._fab.remove(); this._fab=null; } }
}

/* Pre-departure checklist */
class PrepView extends View {
  constructor(app,p){ super(app,p); this.trip = app.store.get(p.id); this.title='Pre-Departure'; this.tab='overview'; this.showBack=true; this.back='/trip/'+p.id+'/overview'; }
  render(){
    const t=this.trip; if(!t) return this.app.notFound();
    const prep = Array.isArray(t.prep) ? t.prep : [];
    if(!prep.length) return `<div class="empty"><div class="e-ico">${svg('briefcase')}</div><h3>No pre-departure list</h3><p>Add a <code>prep</code> section to this trip (the AI prompt can generate one) to see a packing &amp; documents checklist here.</p></div>`;
    let total=0, done=0;
    const secs = prep.map(sec=>{
      const items=(sec.items||[]).map(it=>{
        total++; const on = Storage.get('prep_'+t.id+'_'+it.id)==='1'; if(on) done++;
        return `<label class="check-row${on?' done':''}" data-id="${esc(it.id)}"><input type="checkbox" ${on?'checked':''}><span class="ct">${esc(it.text)}${it.hint?`<small>${esc(it.hint)}</small>`:''}</span></label>`;
      }).join('');
      return `<div class="block"><h4>${esc(sec.title)}</h4>${items}</div>`;
    }).join('');
    return `<div class="eyebrow">Before you fly</div><div class="display" style="margin-bottom:4px">Checklist</div>
      <div class="muted" style="font-size:13px;margin-bottom:14px"><span id="prepDone">${done}</span> of ${total} done · saved on this device</div>
      <div class="card pad">${secs}</div>`;
  }
  mount(){
    this.el.addEventListener('change', e=>{
      const row=e.target.closest('.check-row'); if(!row) return;
      Storage.set('prep_'+this.trip.id+'_'+row.dataset.id, e.target.checked?'1':'0');
      row.classList.toggle('done', e.target.checked);
      const done=$$('.check-row input:checked',this.el).length;
      const el=$('#prepDone',this.el); if(el) el.textContent=done;
    });
  }
}

/* ════════════ App controller ════════════ */
class App {
  constructor(){
    this.store = new TripStore();
    this.fx = new FX();
    this.router = new Router(this);
    this._routes();
    this._chrome();
  }
  _routes(){
    this.router
      .add('/', ()=>new TripsView(this,{}), 0)
      .add('/trips', ()=>new TripsView(this,{}), 0)
      .add('/trip/:id/overview', p=>new OverviewView(this,p), 1)
      .add('/trip/:id/days', p=>new DaysView(this,p), 1)
      .add('/trip/:id/day/:n', p=>new DayDetailView(this,p), 2)
      .add('/trip/:id/map', p=>new MapView(this,p), 1)
      .add('/trip/:id/map/:n', p=>new MapView(this,p), 1)
      .add('/trip/:id/currency', p=>new CurrencyView(this,p), 1)
      .add('/trip/:id/spend', p=>new SpendView(this,p), 1)
      .add('/trip/:id/prep', p=>new PrepView(this,p), 1);
  }
  _chrome(){
    const back=$('#backBtn'), theme=$('#themeBtn');
    back.addEventListener('click', ()=>{ if(this._back) this.router.go(this._back); else history.back(); });
    theme.addEventListener('click', ()=>this.toggleTheme());
    this._syncThemeIcon();
  }
  start(){
    if(!location.hash){
      // Restore wherever the user left off last; fall back to the itineraries list
      // (not a specific trip) on a first launch or if the saved trip is gone.
      let dest = Storage.get('last_route') || '';
      const m = dest.match(/^\/trip\/([^/]+)/);
      if(m && !this.store.get(decodeURIComponent(m[1]))) dest = '';
      location.hash = dest || '/trips';
    }
    this.router.resolve();
    this.fx.refresh();
  }
  applyChrome(view){
    $('#appTitle').textContent = view.title || 'Travel';
    const back=$('#backBtn');
    back.style.visibility = view.showBack ? 'visible' : 'hidden';
    this._back = view.showBack ? (view.back || null) : null;
    // tab bar
    const bar=$('#tabbar');
    if(view.tab){
      const id = view.params.id || this.store.activeId();
      bar.classList.add('show');
      bar.innerHTML = this._tabs(id, view.tab, view);
    } else {
      bar.classList.remove('show'); bar.innerHTML='';
    }
    this._syncThemeIcon();
  }
  _tabs(id, active, view){
    const t=[
      ['overview','home','Overview'],['days','calendar','Days'],['map','map','Map'],['spend','card','Spend'],['convert','exchange','Convert']
    ];
    const ld=this.lastDay(id);
    const trip=this.store.get(id);
    const route={overview:'overview',days:'days',map:'map',spend:'spend',convert:'currency'};
    // Persist the current day: Days returns to it, Map focuses it.
    if(ld!=null && trip && ld>=0 && ld<trip.dayCount){
      route.days = 'day/'+(ld+1);
      route.map = 'map/'+(ld+1);
    }
    // But when already inside a specific day, the Days tab goes up to the list.
    if(view instanceof DayDetailView) route.days = 'days';
    return t.map(([key,ico,lbl])=>`<a class="tab${key===active?' active':''}" href="#/trip/${esc(id)}/${route[key]}"><span class="tab-ico">${svg(ico)}</span>${lbl}</a>`).join('');
  }
  toggleTheme(){
    const cur=document.documentElement.getAttribute('data-theme')||'light';
    const next=cur==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    Storage.set('theme',next);
    const meta=$('#themeColorMeta'); if(meta) meta.setAttribute('content', next==='dark'?'#0E141C':'#162032');
    this._syncThemeIcon();
  }
  _syncThemeIcon(){ const b=$('#themeBtn'); if(b) b.innerHTML = (document.documentElement.getAttribute('data-theme')==='dark') ? svg('sun') : svg('moon'); }

  /* helpers */
  ddmmyyyy(d){ const p=n=>String(n).padStart(2,'0'); return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`; }
  isoToDDMM(iso){ const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? `${m[3]}/${m[2]}/${m[1]}` : ''; }
  ddmmToISO(s){ const m=String(s||'').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if(!m) return '';
    const dd=+m[1], mm=+m[2], yy=+m[3]; if(mm<1||mm>12||dd<1||dd>31) return '';
    const dt=new Date(yy,mm-1,dd); if(dt.getFullYear()!==yy||dt.getMonth()!==mm-1||dt.getDate()!==dd) return '';
    const p=n=>String(n).padStart(2,'0'); return `${yy}-${p(mm)}-${p(dd)}`; }
  fmtRange(t){ return `${this.ddmmyyyy(t.start)} – ${this.ddmmyyyy(t.end)}`; }
  dateLabel(t,i){ const d=t.dayDate(i); return `${WD[d.getDay()]} ${this.ddmmyyyy(d)}`; }
  fmtDateShort(iso){ const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? `${+m[3]} ${MO[+m[2]-1]}` : ''; }
  /* The date a new expense should default to: today, clamped into the trip range. */
  defaultExpenseDate(trip){
    const t=new Date(); t.setHours(0,0,0,0);
    const p=n=>String(n).padStart(2,'0');
    const iso=`${t.getFullYear()}-${p(t.getMonth()+1)}-${p(t.getDate())}`;
    if(trip && trip.startDate && trip.endDate){
      if(iso < trip.startDate) return trip.startDate;
      if(iso > trip.endDate) return trip.endDate;
    }
    return iso;
  }
  notFound(){ return `<div class="empty"><div class="e-ico">${svg('help')}</div><h3>Not found</h3><p><a class="link" href="#/trips">Back to itineraries</a></p></div>`; }
  emptyDays(t){ return `<div class="empty"><div class="e-ico">${svg('calendar')}</div><h3>No days yet</h3></div>`; }
  currencyOptions(sel){
    return CURRENCY_GROUPS.map(g=>`<optgroup label="${esc(g.label)}">`+
      g.items.map(c=>`<option value="${c}"${c===sel?' selected':''}>${c}</option>`).join('')+`</optgroup>`).join('');
  }
  lastDay(id){ const v=Storage.get('lastday_'+id); return (v===''||v==null) ? null : parseInt(v,10); }
  setLastDay(id, idx){ Storage.set('lastday_'+id, String(idx)); }
  clearLastDay(id){ Storage.set('lastday_'+id, ''); }
  expensesFor(id){ return Storage.getJSON('expenses_'+id, []) || []; }
  saveExpenses(id,arr){ Storage.setJSON('expenses_'+id, arr); }
  spentHome(trip, exp){ return (exp||[]).reduce((a,e)=>a + (this.fx.convert(e.amt, e.cur, trip.homeCurrency)||0), 0); }
  loadLeaflet(){
    if(window.L) return Promise.resolve(window.L);
    if(this._leafletP) return this._leafletP;
    this._leafletP = new Promise((res,rej)=>{
      const css=document.createElement('link'); css.rel='stylesheet'; css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(css);
      const s=document.createElement('script'); s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
      s.onload=()=>res(window.L); s.onerror=rej; document.head.appendChild(s);
    });
    return this._leafletP;
  }
  openExpenseSheet(trip, onDone, existing){
    const editing=!!existing;
    let cat = editing ? (existing.cat||'food') : 'food';
    const dateISO = (editing && existing.date) ? existing.date : this.defaultExpenseDate(trip);
    const back=h('<div class="sheet-backdrop"></div>');
    const sheet=h(`<div class="sheet">
      <div class="sheet-grip"></div>
      <h3>${editing?'Edit expense':'Add expense'}</h3>
      <div class="form-grid">
        <div class="form-row"><label>Amount</label><input id="exAmt" inputmode="decimal" placeholder="0" autocomplete="off" value="${editing?esc(existing.amt):''}"></div>
        <div class="form-row"><label>Date</label><input id="exDate" type="date" value="${esc(dateISO)}" autocomplete="off"></div>
      </div>
      <div class="form-row"><label>Currency</label><select id="exCur">${this.currencyOptions(editing?existing.cur:trip.baseCurrency)}</select></div>
      <div class="form-row"><label>Category</label><div class="cat-pick" id="exCats">${Object.keys(CATS).map(k=>`<button data-c="${k}" class="${k===cat?'sel':''}" title="${esc(CATS[k].label)}">${svg(CATS[k].icon)}</button>`).join('')}</div></div>
      <div class="form-row"><label>Note (optional)</label><input id="exNote" placeholder="e.g. Lunch in Lucerne" autocomplete="off" value="${editing?esc(existing.note||''):''}"></div>
      <button class="btn block" id="exSave" style="margin-top:6px">${editing?'Save changes':'Save expense'}</button>
      ${editing?'<button class="btn ghost block" id="exDel" style="margin-top:8px;color:var(--red)">Delete expense</button>':''}
    </div>`);
    const close=()=>{
      if(sheet.classList.contains('closing')) return;
      sheet.classList.add('closing'); back.classList.add('closing');
      const done=()=>{ back.remove(); sheet.remove(); if(!document.querySelector('.sheet')) document.body.classList.remove('no-scroll'); };
      sheet.addEventListener('animationend', done, { once:true });
      setTimeout(done, 460);
    };
    back.addEventListener('click', close);
    // Native date picker on phones — value is already ISO (yyyy-mm-dd).
    const dEl=sheet.querySelector('#exDate');
    sheet.querySelector('#exCats').addEventListener('click', e=>{ const b=e.target.closest('[data-c]'); if(!b) return; cat=b.dataset.c; $$('#exCats button',sheet).forEach(x=>x.classList.toggle('sel',x===b)); });
    sheet.querySelector('#exSave').addEventListener('click', ()=>{
      const amt=parseFloat(sheet.querySelector('#exAmt').value); if(!amt||amt<=0){ toast('Enter an amount'); return; }
      const date=dEl.value; if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ toast('Pick a date'); return; }
      const cur=sheet.querySelector('#exCur').value, note=sheet.querySelector('#exNote').value.trim();
      const arr=this.expensesFor(trip.id);
      if(editing){
        const it=arr.find(x=>x.id===existing.id);
        if(it){ it.cat=cat; it.amt=amt; it.cur=cur; it.note=note; it.date=date; }
      } else {
        arr.unshift({ id:uid(), cat, amt, cur, note, date, ts:Date.now() });
      }
      this.saveExpenses(trip.id, arr);
      close(); toast(editing?'Expense updated':'Expense added'); onDone && onDone();
    });
    const delBtn=sheet.querySelector('#exDel');
    if(delBtn) delBtn.addEventListener('click', ()=>{
      const arr=this.expensesFor(trip.id).filter(x=>x.id!==existing.id);
      this.saveExpenses(trip.id, arr);
      close(); toast('Expense removed'); onDone && onDone();
    });
    document.body.appendChild(back); document.body.appendChild(sheet); document.body.classList.add('no-scroll');
    setTimeout(()=>sheet.querySelector('#exAmt').focus(), 80);
  }
  /* Open a print-friendly spending report; the browser's print dialog saves it as PDF. */
  exportSpendPDF(trip){
    const exp=this.expensesFor(trip.id).slice().sort(this._expCmp);
    if(!exp.length){ toast('No expenses to export'); return; }
    const hc=trip.homeCurrency;
    const spent=this.spentHome(trip,exp), budget=trip.budget||0;
    const sums={}; exp.forEach(e=>{ const v=this.fx.convert(e.amt,e.cur,hc)||0; sums[e.cat]=(sums[e.cat]||0)+v; });
    const catRows=Object.keys(sums).sort((a,b)=>sums[b]-sums[a]).map(c=>{
      const l=(CATS[c]||CATS.other);
      return `<tr><td>${esc(l.label)}</td><td class="r">${esc(fmtMoney(sums[c],hc))}</td></tr>`;
    }).join('');
    const rows=exp.map(e=>{
      const l=(CATS[e.cat]||CATS.other);
      const home=this.fx.convert(e.amt,e.cur,hc);
      const orig=e.cur===hc?'':esc(fmtMoney(e.amt,e.cur));
      return `<tr><td>${esc(this.fmtDateShort(e.date))}</td><td>${esc(l.label)}</td><td>${esc(e.note||'')}</td><td class="r">${orig}</td><td class="r">${esc(fmtMoney(home,hc))}</td></tr>`;
    }).join('');
    const today=this.ddmmyyyy(new Date());
    const report=`<div class="pdf-doc">
      <h1>${esc(trip.name)}</h1>
      <p class="sub">${esc(this.fmtRange(trip))} · Spending report</p>
      <div class="tot">${esc(fmtMoney(spent,hc))}</div>
      <div class="meta">Total spent${budget?` · ${esc(fmtMoney(Math.max(0,budget-spent),hc))} of ${esc(fmtMoney(budget,hc))} remaining`:''} · ${exp.length} item${exp.length===1?'':'s'} · generated ${esc(today)}</div>
      <h2>By category</h2>
      <table><tbody>${catRows}</tbody></table>
      <h2>All expenses</h2>
      <table>
        <thead><tr><th>Date</th><th>Category</th><th>Note</th><th class="r">Paid</th><th class="r">${esc(hc)}</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><td colspan="4">Total</td><td class="r">${esc(fmtMoney(spent,hc))}</td></tr></tfoot>
      </table></div>`;
    // Render the report inside the app as a full-screen overlay with a Back button,
    // so the user is never stranded (a popup window has no in-app way back, especially
    // in a standalone PWA). The toolbar's Save button triggers the browser print dialog.
    const overlay=h('<div class="pdf-overlay"></div>');
    overlay.innerHTML=`
      <div class="pdf-bar">
        <button class="appbar-btn" id="pdfBack" aria-label="Back">‹</button>
        <span class="pdf-title">Spending report</span>
        <button class="pdf-print" id="pdfPrint">${svg('file')} Save as PDF</button>
      </div>
      <div class="pdf-scroll">${report}</div>`;
    document.body.appendChild(overlay);
    document.body.classList.add('no-scroll');
    let closed=false;
    const cleanup=()=>{
      if(closed) return; closed=true;
      window.removeEventListener('popstate', onPop);
      // Slide the report back down before removing it, mirroring the open animation.
      overlay.classList.add('closing');
      const done=()=>{ overlay.remove(); if(!document.querySelector('.sheet') && !document.querySelector('.pdf-overlay')) document.body.classList.remove('no-scroll'); };
      overlay.addEventListener('animationend', done, { once:true });
      setTimeout(done, 420);
    };
    // One history entry guards the overlay so the hardware/browser back gesture closes
    // it (and lands back in the app) instead of leaving the user stranded on the report.
    const onPop=()=>cleanup();
    history.pushState({pdf:1}, '');
    window.addEventListener('popstate', onPop);
    const closeBtn=()=>{ if(history.state && history.state.pdf) history.back(); else cleanup(); };
    overlay.querySelector('#pdfBack').addEventListener('click', closeBtn);
    overlay.querySelector('#pdfPrint').addEventListener('click', ()=>{ try{ window.print(); }catch(e){} });
  }
  /* Sort expenses newest first by date, then by entry time. */
  _expCmp(a,b){ const da=a.date||'', db=b.date||''; if(da!==db) return db<da?-1:1; return (b.ts||0)-(a.ts||0); }

  /* ── Generic bottom-sheet helper ── */
  sheet(innerHTML){
    const back=h('<div class="sheet-backdrop"></div>');
    const sheet=h(`<div class="sheet"><div class="sheet-grip"></div>${innerHTML}</div>`);
    const close=()=>{
      if(sheet.classList.contains('closing')) return;
      sheet.classList.add('closing'); back.classList.add('closing');
      const done=()=>{ back.remove(); sheet.remove(); if(!document.querySelector('.sheet')) document.body.classList.remove('no-scroll'); };
      sheet.addEventListener('animationend', done, { once:true });
      setTimeout(done, 460);
    };
    back.addEventListener('click', close);
    document.body.appendChild(back); document.body.appendChild(sheet); document.body.classList.add('no-scroll');
    return { back, sheet, close, $:(s)=>sheet.querySelector(s) };
  }

  /* ── Export / Import ── */
  download(filename, text){
    const blob=new Blob([text],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }
  exportTrip(trip){
    const data=this.store.trips[trip.id]; if(!data) return;
    this.download((trip.id||'trip')+'.json', JSON.stringify(data,null,2));
    toast('Exported '+trip.name);
  }
  /* Copy text to clipboard, with a legacy fallback for non-secure contexts. */
  copyText(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(text).catch(()=>this._copyFallback(text));
    }
    return this._copyFallback(text);
  }
  _copyFallback(text){
    return new Promise((res,rej)=>{
      try{
        const ta=document.createElement('textarea'); ta.value=text;
        ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
        ta.focus(); ta.select(); document.execCommand('copy'); ta.remove(); res();
      }catch(e){ rej(e); }
    });
  }
  /* Parse pasted JSON, tolerating ```json fences and surrounding prose. */
  _parseImport(raw){
    let s = String(raw).trim();
    const fence = s.match(/```(?:json|jsonc)?\s*([\s\S]*?)```/i);
    if(fence) s = fence[1].trim();
    try{ return JSON.parse(s); }catch(e){}
    // Fall back: slice from the first opening brace/bracket to the last closing one.
    const fObj = s.indexOf('{'), fArr = s.indexOf('[');
    let start, close;
    if(fArr!==-1 && (fObj===-1 || fArr<fObj)){ start=fArr; close=']'; }
    else { start=fObj; close='}'; }
    if(start===-1) throw new Error("That isn't valid JSON");
    const end = s.lastIndexOf(close);
    if(end>start){ try{ return JSON.parse(s.slice(start, end+1)); }catch(e){} }
    throw new Error("That isn't valid JSON");
  }
  openImport(onDone){
    const ui=this.sheet(`
      <h3>Import itinerary</h3>
      <div class="hint">Copy the AI prompt below, paste it into any AI (Claude / ChatGPT / Gemini) with your rough plan, then paste its JSON reply here. Or pick a <code>.json</code> file you exported earlier. Code fences and extra text are stripped automatically.</div>
      <button class="btn ghost block" id="impCopyPrompt" style="margin-bottom:12px">${svg('copy')} Copy AI prompt</button>
      <div class="form-row"><label>JSON file</label><input id="impFile" type="file" accept="application/json,.json"></div>
      <textarea id="impText" placeholder='{ "name": "My Trip", "startDate": "2026-01-01", ... }'></textarea>
      <div class="sheet-actions"><button class="btn ghost block" id="impCancel">Cancel</button><button class="btn block" id="impGo">Import</button></div>`);
    ui.$('#impCopyPrompt').addEventListener('click', ()=>{
      fetch('./AI_JSON_GUIDE.md').then(r=>{ if(!r.ok) throw 0; return r.text(); })
        .then(txt=>this.copyText(txt).then(()=>toast('AI prompt copied — paste it into any AI')))
        .catch(()=>toast('Couldn\'t load the prompt'));
    });
    ui.$('#impFile').addEventListener('change', e=>{
      const f=e.target.files[0]; if(!f) return;
      const r=new FileReader(); r.onload=()=>{ ui.$('#impText').value=r.result; }; r.readAsText(f);
    });
    ui.$('#impCancel').addEventListener('click', ui.close);
    ui.$('#impGo').addEventListener('click', ()=>{
      let raw=ui.$('#impText').value.trim();
      if(!raw){ toast('Paste JSON or pick a file'); return; }
      let obj; try{ obj=this._parseImport(raw); }catch(e){ toast(e.message||'That isn\'t valid JSON'); return; }
      const trips = Array.isArray(obj) ? obj : [obj];
      let lastId=null, n=0;
      try{
        trips.forEach(o=>{ lastId=this.store.add(o); n++; });
      }catch(e){ toast(e.message||'Import failed'); return; }
      if(lastId) this.store.setActive(lastId);
      ui.close(); toast(n>1?('Imported '+n+' trips'):'Itinerary imported');
      onDone && onDone(lastId);
    });
    setTimeout(()=>ui.$('#impText').focus(), 80);
  }

  /* ── Create / edit trip meta ── */
  openTripForm(trip, onDone, onCancel){
    const editing=!!trip;
    const d = trip ? this.store.trips[trip.id] : { name:'', tagline:'', startDate:'', endDate:'', travelers:2, baseCurrency:'CHF', homeCurrency:'AED', budget:0 };
    const ui=this.sheet(`
      <h3>${editing?'Edit trip':'New itinerary'}</h3>
      <div class="form-row"><label>Name</label><input id="tfName" value="${esc(d.name)}" placeholder="e.g. Japan Spring 2026" autocomplete="off"></div>
      <div class="form-row"><label>Tagline</label><input id="tfTag" value="${esc(d.tagline||'')}" placeholder="e.g. Cherry blossoms + temples" autocomplete="off"></div>
      <div class="form-grid">
        <div class="form-row"><label>Start date</label><input id="tfStart" type="text" inputmode="numeric" maxlength="10" placeholder="dd/mm/yyyy" value="${esc(this.isoToDDMM(d.startDate))}" autocomplete="off"></div>
        <div class="form-row"><label>End date</label><input id="tfEnd" type="text" inputmode="numeric" maxlength="10" placeholder="dd/mm/yyyy" value="${esc(this.isoToDDMM(d.endDate))}" autocomplete="off"></div>
      </div>
      <div class="form-grid">
        <div class="form-row"><label>Travellers</label><input id="tfTrav" type="number" min="1" value="${esc(d.travelers||1)}"></div>
        <div class="form-row"><label>Budget (${esc(d.homeCurrency||'AED')})</label><input id="tfBudget" type="number" min="0" value="${esc(d.budget||0)}"></div>
      </div>
      <div class="form-grid">
        <div class="form-row"><label>Spending currency</label><select id="tfBase">${this.currencyOptions(d.baseCurrency||'CHF')}</select></div>
        <div class="form-row"><label>Home currency</label><select id="tfHome">${this.currencyOptions(d.homeCurrency||'AED')}</select></div>
      </div>
      ${editing?'':'<div class="hint">A blank day will be created for each date in the range — you can edit them afterwards.</div>'}
      <div class="sheet-actions"><button class="btn ghost block" id="tfCancel">Cancel</button><button class="btn block" id="tfSave">${editing?'Save changes':'Create trip'}</button></div>`);
    ui.$('#tfCancel').addEventListener('click', ()=>{ ui.close(); if(onCancel) onCancel(); });
    // Auto-insert slashes so the field reads dd/mm/yyyy as you type.
    const maskDate=(el)=>el.addEventListener('input', ()=>{
      const v=el.value.replace(/[^\d]/g,'').slice(0,8);
      el.value = v.length>=5 ? v.slice(0,2)+'/'+v.slice(2,4)+'/'+v.slice(4)
               : v.length>=3 ? v.slice(0,2)+'/'+v.slice(2) : v;
    });
    maskDate(ui.$('#tfStart')); maskDate(ui.$('#tfEnd'));
    ui.$('#tfSave').addEventListener('click', ()=>{
      const meta={
        name:ui.$('#tfName').value.trim(),
        tagline:ui.$('#tfTag').value.trim(),
        startDate:this.ddmmToISO(ui.$('#tfStart').value),
        endDate:this.ddmmToISO(ui.$('#tfEnd').value),
        travelers:ui.$('#tfTrav').value,
        budget:ui.$('#tfBudget').value,
        baseCurrency:ui.$('#tfBase').value,
        homeCurrency:ui.$('#tfHome').value
      };
      if(!meta.name){ toast('Give your trip a name'); return; }
      if(!/^\d{4}-\d{2}-\d{2}$/.test(meta.startDate) || !/^\d{4}-\d{2}-\d{2}$/.test(meta.endDate)){ toast('Enter dates as dd/mm/yyyy'); return; }
      if(meta.endDate < meta.startDate){ toast('End date is before start'); return; }
      try{
        if(editing){
          const next=Object.assign({}, d, this.store.normalizeTrip(Object.assign({}, d, meta, { id:trip.id, days:d.days })));
          next.id = trip.id; // keep the same id so expenses/checklist/routes stay linked (normalizeTrip can re-slug)
          this.store.update(trip.id, next);
          ui.close(); toast('Trip updated'); onDone && onDone(trip.id);
        } else {
          const t=this.store.blankTrip(meta);
          this.store.trips[t.id]=t; this.store.save(); this.store.setActive(t.id);
          ui.close(); toast('Trip created'); onDone && onDone(t.id);
        }
      }catch(e){ toast(e.message||'Could not save'); }
    });
    setTimeout(()=>ui.$('#tfName').focus(), 80);
  }

  /* ── Per-trip action menu (edit / export / activate / delete) ── */
  openTripMenu(trip){
    const ui=this.sheet(`
      <h3>${esc(trip.name)}</h3>
      <div class="menu-list">
        <button data-a="edit"><span class="mi">${svg('pencil')}</span>Edit details</button>
        <button data-a="json"><span class="mi">${svg('code')}</span>Edit JSON</button>
        <button data-a="export"><span class="mi">${svg('upload')}</span>Export JSON</button>
        <button data-a="active"><span class="mi">${svg('star')}</span>Set as active trip</button>
        <button data-a="delete" class="danger"><span class="mi">${svg('trash')}</span>Delete trip</button>
      </div>
      <div class="sheet-actions"><button class="btn ghost block" id="tmCancel">Cancel</button></div>`);
    ui.$('#tmCancel').addEventListener('click', ui.close);
    ui.sheet.querySelector('.menu-list').addEventListener('click', e=>{
      const b=e.target.closest('[data-a]'); if(!b) return;
      const a=b.dataset.a;
      if(a==='edit'){ ui.close(); this.openTripForm(trip, ()=>this.router.resolve(), ()=>this.openTripMenu(trip)); }
      else if(a==='json'){ ui.close(); this.openJsonEditor(trip, ()=>this.router.resolve(), ()=>this.openTripMenu(trip)); }
      else if(a==='export'){ ui.close(); this.exportTrip(trip); }
      else if(a==='active'){ this.store.setActive(trip.id); ui.close(); toast(trip.name+' is now active'); this.router.resolve(); }
      else if(a==='delete'){
        if(!confirm('Delete "'+trip.name+'"? This removes its days and expenses on this device.')) return;
        this.store.remove(trip.id); ui.close(); toast('Trip deleted'); this.router.go('/trips');
      }
    });
  }

  /* ── Edit the trip's raw JSON directly ── */
  openJsonEditor(trip, onDone, onCancel){
    const data=this.store.trips[trip.id]; if(!data){ toast('Trip not found'); return; }
    const ui=this.sheet(`
      <h3>Edit JSON</h3>
      <div class="hint">Edit this itinerary's raw data. The <code>id</code> is kept fixed so your expenses and checklist stay attached. Invalid JSON won't be saved.</div>
      <button class="btn ghost block" id="jeCopy" style="margin-bottom:12px">${svg('copy')} Copy JSON</button>
      <textarea id="jeText" spellcheck="false" autocapitalize="off" autocomplete="off" style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;min-height:46vh;white-space:pre"></textarea>
      <div class="sheet-actions"><button class="btn ghost block" id="jeCancel">Cancel</button><button class="btn block" id="jeSave">Save changes</button></div>`);
    ui.$('#jeText').value = JSON.stringify(data, null, 2);
    ui.$('#jeCopy').addEventListener('click', ()=> this.copyText(ui.$('#jeText').value).then(()=>toast('JSON copied')).catch(()=>toast('Copy failed')) );
    ui.$('#jeCancel').addEventListener('click', ()=>{ ui.close(); if(onCancel) onCancel(); });
    ui.$('#jeSave').addEventListener('click', ()=>{
      let obj; try{ obj=this._parseImport(ui.$('#jeText').value); }catch(e){ toast(e.message||'That isn\'t valid JSON'); return; }
      if(Array.isArray(obj)) obj=obj[0];
      let normalized; try{ normalized=this.store.normalizeTrip(obj); }catch(e){ toast(e.message||'Could not save'); return; }
      normalized.id = trip.id; // keep editing the same trip so expenses/checklist stay linked
      this.store.update(trip.id, normalized);
      ui.close(); toast('Itinerary updated'); onDone && onDone(trip.id);
    });
    setTimeout(()=>ui.$('#jeText').focus(), 80);
  }

  /* ── Edit a single day's raw JSON directly ── */
  openDayJsonEditor(trip, idx, onDone){
    const data=this.store.trips[trip.id];
    if(!data || !data.days || !data.days[idx]){ toast('Day not found'); return; }
    const ui=this.sheet(`
      <h3>Edit day ${idx+1} JSON</h3>
      <div class="hint">Edit just this day's raw data — <code>title</code>, <code>date</code>, <code>tags</code> and <code>timeline</code>. Invalid JSON won't be saved.</div>
      <button class="btn ghost block" id="djCopy" style="margin-bottom:12px">${svg('copy')} Copy JSON</button>
      <textarea id="djText" spellcheck="false" autocapitalize="off" autocomplete="off" style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;min-height:46vh;white-space:pre"></textarea>
      <div class="sheet-actions"><button class="btn ghost block" id="djCancel">Cancel</button><button class="btn block" id="djSave">Save changes</button></div>`);
    ui.$('#djText').value = JSON.stringify(data.days[idx], null, 2);
    ui.$('#djCopy').addEventListener('click', ()=> this.copyText(ui.$('#djText').value).then(()=>toast('JSON copied')).catch(()=>toast('Copy failed')) );
    ui.$('#djCancel').addEventListener('click', ui.close);
    ui.$('#djSave').addEventListener('click', ()=>{
      let obj; try{ obj=JSON.parse(ui.$('#djText').value); }catch(e){ toast('That isn\'t valid JSON'); return; }
      if(!obj || typeof obj!=='object' || Array.isArray(obj)){ toast('A day must be a JSON object'); return; }
      if(!obj.title || !String(obj.title).trim()){ toast('Day needs a title'); return; }
      if(!Array.isArray(obj.timeline)) obj.timeline = Array.isArray(obj.timeline) ? obj.timeline : [];
      data.days[idx]=obj; this.store.save();
      ui.close(); toast('Day updated'); onDone && onDone(idx);
    });
    setTimeout(()=>ui.$('#djText').focus(), 80);
  }

  /* ── Add / edit / delete a day ── */
  openDayForm(trip, idx, onDone){
    const editing = idx!=null;
    const data=this.store.trips[trip.id];
    const day = editing ? data.days[idx] : { title:'', date:'', tags:[], timeline:[] };
    const ui=this.sheet(`
      <h3>${editing?'Edit day '+(idx+1):'Add a day'}</h3>
      <div class="form-row"><label>Title</label><input id="dfTitle" value="${esc(day.title||'')}" placeholder="e.g. Arrival in Tokyo" autocomplete="off"></div>
      <div class="form-row"><label>Date</label><input id="dfDate" type="date" value="${esc(day.date||'')}"></div>
      <div class="form-row"><label>Tags (comma separated)</label><input id="dfTags" value="${esc((day.tags||[]).join(', '))}" placeholder="e.g. 🚄 Travel, 🏯 Sightseeing" autocomplete="off"></div>
      <div class="sheet-actions">
        ${editing?'<button class="btn danger block" id="dfDelete">Delete</button>':'<button class="btn ghost block" id="dfCancel">Cancel</button>'}
        <button class="btn block" id="dfSave">${editing?'Save':'Add day'}</button>
      </div>`);
    const cancel=ui.$('#dfCancel'); cancel && cancel.addEventListener('click', ui.close);
    const del=ui.$('#dfDelete');
    del && del.addEventListener('click', ()=>{
      if(!confirm('Delete day '+(idx+1)+'?')) return;
      data.days.splice(idx,1); this.store.save(); ui.close(); toast('Day deleted'); onDone && onDone('deleted');
    });
    ui.$('#dfSave').addEventListener('click', ()=>{
      const title=ui.$('#dfTitle').value.trim(); if(!title){ toast('Day needs a title'); return; }
      const tags=ui.$('#dfTags').value.split(',').map(s=>s.trim()).filter(Boolean);
      const date=ui.$('#dfDate').value || undefined;
      if(editing){ day.title=title; day.tags=tags; day.date=date; }
      else { data.days.push({ title, date, tags, timeline:[] }); }
      this.store.save(); ui.close(); toast(editing?'Day saved':'Day added'); onDone && onDone(editing?idx:data.days.length-1);
    });
    setTimeout(()=>ui.$('#dfTitle').focus(), 80);
  }

  /* ── Add / edit / delete a timeline stop ── */
  openStopForm(trip, di, si, onDone){
    const editing = si!=null;
    const data=this.store.trips[trip.id];
    const tl=data.days[di].timeline;
    const s = editing ? tl[si] : { time:'', label:'', note:'', placeQuery:'', kind:'normal', bookLink:null };
    const kinds=[['normal','Normal'],['highlight','Highlight'],['meal','Meal'],['transport','Transport'],['hotel','Hotel']];
    const ui=this.sheet(`
      <h3>${editing?'Edit stop':'Add stop'}</h3>
      <div class="form-grid">
        <div class="form-row"><label>Time</label><input id="sfTime" value="${esc(s.time||'')}" placeholder="e.g. 09:30" autocomplete="off"></div>
        <div class="form-row"><label>Type</label><select id="sfKind">${kinds.map(([k,l])=>`<option value="${k}"${(s.kind||'normal')===k?' selected':''}>${l}</option>`).join('')}</select></div>
      </div>
      <div class="form-row"><label>Label</label><input id="sfLabel" value="${esc(s.label||'')}" placeholder="e.g. Senso-ji Temple" autocomplete="off"></div>
      <div class="form-row"><label>Map search (optional)</label><input id="sfPlace" value="${esc(s.placeQuery||'')}" placeholder="e.g. Senso-ji, Tokyo" autocomplete="off"></div>
      <div class="form-row"><label>Note (optional)</label><input id="sfNote" value="${esc(s.note||'')}" placeholder="Anything to remember" autocomplete="off"></div>
      <div class="form-grid">
        <div class="form-row"><label>Booking label (optional)</label><input id="sfBookLabel" value="${esc(s.bookLink&&s.bookLink.label||'')}" placeholder="e.g. Buy tickets" autocomplete="off"></div>
        <div class="form-row"><label>Booking URL (optional)</label><input id="sfBookUrl" value="${esc(s.bookLink&&s.bookLink.url||'')}" placeholder="https://…" autocomplete="off"></div>
      </div>
      <div class="sheet-actions">
        ${editing?'<button class="btn danger block" id="sfDelete">Delete</button>':'<button class="btn ghost block" id="sfCancel">Cancel</button>'}
        <button class="btn block" id="sfSave">${editing?'Save':'Add stop'}</button>
      </div>`);
    const cancel=ui.$('#sfCancel'); cancel && cancel.addEventListener('click', ui.close);
    const del=ui.$('#sfDelete');
    del && del.addEventListener('click', ()=>{ tl.splice(si,1); this.store.save(); ui.close(); toast('Stop deleted'); onDone && onDone(); });
    ui.$('#sfSave').addEventListener('click', ()=>{
      const label=ui.$('#sfLabel').value.trim(); if(!label){ toast('Stop needs a label'); return; }
      const o={ time:ui.$('#sfTime').value.trim(), label };
      const note=ui.$('#sfNote').value.trim(); if(note) o.note=note;
      const place=ui.$('#sfPlace').value.trim(); if(place) o.placeQuery=place;
      const kind=ui.$('#sfKind').value; if(kind && kind!=='normal') o.kind=kind;
      const bl=ui.$('#sfBookLabel').value.trim(), bu=ui.$('#sfBookUrl').value.trim();
      if(bu) o.bookLink={ label:bl||'Book', url:bu };
      if(editing) tl[si]=o; else tl.push(o);
      this.store.save(); ui.close(); toast(editing?'Stop saved':'Stop added'); onDone && onDone();
    });
    setTimeout(()=>ui.$('#sfLabel').focus(), 80);
  }
}

/* update banner */
window.__showUpdateBanner = function(reg){
  if($('#updateBanner')) return;
  const b=h(`<div class="update-banner" id="updateBanner"><span style="flex:1;font-size:13px">A new version is ready.</span><button>Refresh</button></div>`);
  b.querySelector('button').addEventListener('click', ()=>{ if(reg.waiting) reg.waiting.postMessage({type:'SKIP_WAITING'}); else location.reload(); });
  document.body.appendChild(b);
};

/* boot */
const app = new App();
window.__app = app;
app.start();

// Tap-away to dismiss: tapping outside a focused field blurs it (hides the
// keyboard / clears the focus ring) instead of leaving it stuck active.
document.addEventListener('pointerdown', e=>{
  const a=document.activeElement;
  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) &&
     !e.target.closest('input,textarea,select,label,button,.key,.chip')){
    a.blur();
  }
}, true);
</script>

<script>
  // Service worker + update banner
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').then(reg => {
        reg.addEventListener('updatefound', () => {
          const nw = reg.installing;
          if (!nw) return;
          nw.addEventListener('statechange', () => {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
              window.__showUpdateBanner && window.__showUpdateBanner(reg);
            }
          });
        });
      }).catch(()=>{});
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return; refreshing = true; location.reload();
      });
    });
  }
</script>
</body>
