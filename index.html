<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Travel Itinerary</title>

<!-- ─── PWA ─── -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#162032" id="themeColorMeta">
<script>
  // Local-date formatter (YYYY-MM-DD) — avoids the UTC shift of toISOString()
  // that rolled trip dates back a day in positive-offset timezones (e.g. Dubai).
  window.isoLocal = function(d){
    d = d || new Date();
    const y = d.getFullYear(),
          m = String(d.getMonth() + 1).padStart(2, '0'),
          day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  };
  // Apply persisted theme before paint to avoid FOUC
  (function(){
    try {
      const t = localStorage.getItem('theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    } catch(e){}
  })();
</script>
<meta name="application-name" content="Travel Itinerary">
<meta name="description" content="A polished, offline-ready travel itinerary app: day-by-day plans, an interactive map, a live currency converter, and a multi-currency spending tracker.">

<!-- iOS standalone app -->

<meta name="mobile-web-app-capable" content="yes">

<!-- Leaflet (map view) — loaded lazily by MapView, but CSS preconnect helps -->

<link rel="preconnect" href="https://tile.openstreetmap.org">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F5F1E8;
    --navy: #162032;
    --navy-text: #162032;
    --red: #C8102E;
    --gold: #A0792A;
    --gold-light: #D4A84B;
    --green: #2C5244;
    --border: #DDD8CC;
    --card: #FFFFFF;
    --card-soft: #FAFAF7;
    --text: #1C1A17;
    --text-muted: #6B6860;
    --maps: #4285F4;
    --tip-bg: #FFFCE8;
    --tip-border: #E8C770;
    --tip-text: #6B5A1A;
    --shadow-soft: 0 4px 24px rgba(22,32,50,0.09);
    --shadow-pop: 0 12px 40px rgba(22,32,50,0.18);
    --r-lg: 22px;
    --r-md: 16px;
    --r-sm: 11px;
    --appbar-h: 56px;
    --tabbar-h: 64px;
    --maxw: 720px;
    --ease: cubic-bezier(.22,.61,.36,1);
  }
  [data-theme="dark"] {
    --bg: #0E141C;
    --navy: #1A2230;
    --navy-text: #E8EDF5;
    --red: #E84355;
    --gold: #D4A84B;
    --gold-light: #E8C770;
    --green: #5FA088;
    --border: #2B3445;
    --card: #1A2230;
    --card-soft: #161D2A;
    --text: #E5E2D8;
    --text-muted: #9A968E;
    --maps: #5B9BFF;
    --tip-bg: #2A2410;
    --tip-border: #6B5E20;
    --tip-text: #E8C770;
    --shadow-soft: 0 4px 24px rgba(0,0,0,0.45);
    --shadow-pop: 0 14px 44px rgba(0,0,0,0.6);
  }

  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
    /* Kill the 300ms double-tap-to-zoom gesture (pinch-zoom still works). */
    touch-action: manipulation;
  }
  body.no-scroll { overflow: hidden; }
  h1,h2,h3,h4 { font-family: 'DM Sans', system-ui, sans-serif; color: var(--navy-text); line-height: 1.12; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  img { max-width: 100%; display: block; }
  /* Inline SVG icons scale with their container's font-size and inherit colour. */
  .ic { width: 1.18em; height: 1.18em; display: inline-block; vertical-align: -0.2em; flex: 0 0 auto; }
  .chip .ic, .btn .ic { vertical-align: -0.16em; }

  /* ─── App frame ─── */
  .appbar {
    position: sticky; top: 0; z-index: 50;
    height: calc(var(--appbar-h) + env(safe-area-inset-top));
    padding-top: env(safe-area-inset-top);
    display: flex; align-items: center; gap: 6px;
    padding-left: 8px; padding-right: 8px;
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    -webkit-backdrop-filter: saturate(160%) blur(14px);
    backdrop-filter: saturate(160%) blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .appbar-btn {
    width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 18px; color: var(--navy-text);
    transition: background .18s, transform .18s;
    flex: 0 0 auto;
  }
  .appbar-btn:active { transform: scale(.9); }
  @media (hover: hover) { .appbar-btn:hover { background: color-mix(in srgb, var(--text) 8%, transparent); } }
  .appbar-title {
    flex: 1; min-width: 0;
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 22px; font-weight: 600; color: var(--navy-text);
    text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: 0; transform: translateY(4px);
    animation: titleIn .35s var(--ease) forwards;
  }
  @keyframes titleIn { to { opacity: 1; transform: none; } }
  .appbar-spacer { width: 40px; flex: 0 0 auto; }

  /* ─── View outlet & transitions ─── */
  .view-outlet { position: relative; overflow-x: clip; }
  /* While two views overlap during a swipe, clip vertically too so the taller
     (absolutely-positioned) outgoing view can't briefly add a scrollbar — that
     would shift every position:fixed element (e.g. the + button) sideways. */
  .view-outlet.swiping { overflow-y: clip; }
  .view {
    max-width: var(--maxw); margin: 0 auto;
    padding: 18px 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 28px);
    min-height: 60vh;
  }
  /* Full-page swipe: the incoming view glides in from one edge while the
     outgoing view (positioned absolutely on top) slides off the other edge. */
  .view-enter-fwd  { position: relative; z-index: 2; animation: swipeInRight .42s var(--ease) both; }
  .view-enter-back { position: relative; z-index: 2; animation: swipeInLeft  .42s var(--ease) both; }
  .view-leave-fwd, .view-leave-back {
    position: absolute; top: 0; left: 0; right: 0; z-index: 1; pointer-events: none;
  }
  .view-leave-fwd  { animation: swipeOutLeft  .42s var(--ease) both; }
  .view-leave-back { animation: swipeOutRight .42s var(--ease) both; }
  /* Travel = half the viewport + half the element (+ a small buffer past any
     scrollbar gutter), so a centred column on a wide screen always clears the
     edge completely. On mobile this is just over 100% — fully off, then clipped. */
  @keyframes swipeInRight { from { transform: translateX(calc(50vw + 50% + 24px)); }  to { transform: none; } }
  @keyframes swipeInLeft  { from { transform: translateX(calc(-50vw - 50% - 24px)); } to { transform: none; } }
  @keyframes swipeOutLeft  { from { transform: none; } to { transform: translateX(calc(-50vw - 50% - 24px)); } }
  @keyframes swipeOutRight { from { transform: none; } to { transform: translateX(calc(50vw + 50% + 24px)); } }
  /* Same-level tab swaps keep a soft fade */
  .view-anim-fade { animation: fadeUp .46s var(--ease) both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  /* staggered list reveal */
  .stagger > * { opacity: 0; animation: fadeUp .42s var(--ease) forwards; }
  .stagger > *:nth-child(1){ animation-delay:.02s } .stagger > *:nth-child(2){ animation-delay:.06s }
  .stagger > *:nth-child(3){ animation-delay:.10s } .stagger > *:nth-child(4){ animation-delay:.14s }
  .stagger > *:nth-child(5){ animation-delay:.18s } .stagger > *:nth-child(6){ animation-delay:.22s }
  .stagger > *:nth-child(7){ animation-delay:.26s } .stagger > *:nth-child(8){ animation-delay:.30s }
  .stagger > *:nth-child(n+9){ animation-delay:.34s }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001s !important; transition-duration: .001s !important; }
    html { scroll-behavior: auto; }
  }

  /* ─── Bottom tab bar ─── */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    display: none;
    background: color-mix(in srgb, var(--card) 90%, transparent);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border-top: 1px solid var(--border);
  }
  .tabbar.show { display: flex; }
  .tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; font-size: 10px; letter-spacing: .02em; color: var(--text-muted);
    transition: color .18s; position: relative; padding-top: 4px;
  }
  .tab .tab-ico { font-size: 19px; line-height: 1; transition: transform .22s var(--ease); }
  .tab.active { color: var(--navy-text); }
  .tab.active .tab-ico { transform: translateY(-2px) scale(1.12); }
  .tab.active::before {
    content:''; position: absolute; top: 0; width: 22px; height: 3px; border-radius: 3px;
    background: var(--red); animation: tabPop .3s var(--ease) both;
  }
  @keyframes tabPop { from { transform: scaleX(0); opacity:0 } to { transform: none; opacity:1 } }

  /* ─── Generic UI ─── */
  .eyebrow { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
  .display { font-size: clamp(30px, 8vw, 44px); font-weight: 700; letter-spacing: -.01em; margin: 4px 0 2px; }
  .muted { color: var(--text-muted); }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--r-md);
    box-shadow: var(--shadow-soft); overflow: hidden;
  }
  .pad { padding: 16px 18px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .between { justify-content: space-between; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; padding: 5px 11px; border-radius: 999px;
    background: var(--card-soft); border: 1px solid var(--border); color: var(--text);
    white-space: nowrap;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    padding: 11px 18px; border-radius: var(--r-sm); font-size: 14px; font-weight: 500;
    background: var(--navy); color: #fff; transition: transform .15s, opacity .15s, box-shadow .15s;
  }
  [data-theme="dark"] .btn { color: var(--navy-text); background: color-mix(in srgb, var(--gold) 26%, var(--card)); }
  .btn:active { transform: scale(.97); }
  .btn.ghost { background: var(--card-soft); color: var(--text); border: 1px solid var(--border); }
  .btn.block { width: 100%; }
  .btn-row { display: flex; gap: 10px; margin: 14px 0 4px; }
  .btn-row .btn { flex: 1; }
  .btn.red { background: var(--red); color: #fff; }
  .divider { height: 1px; background: var(--border); margin: 0; border: 0; }

  /* ─── Hero (overview) ─── */
  .hero-card {
    position: relative; border-radius: var(--r-lg); overflow: hidden; color: #fff;
    background:
      radial-gradient(120% 130% at 100% 0%, rgba(200,16,46,.34), transparent 55%),
      linear-gradient(155deg, #1c2840 0%, #0f1726 100%);
    box-shadow: var(--shadow-pop); padding: 26px 22px 22px;
  }
  /* Title block sits beside the countdown badge; min-width:0 lets the long
     title wrap within its own column instead of sliding under the badge. */
  .hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
  .hero-head { min-width: 0; }
  .hero-card .eyebrow { color: var(--gold-light); }
  .hero-card h1 { color: #fff; font-size: clamp(32px, 9vw, 50px); font-weight: 700; margin: 6px 0; overflow-wrap: break-word; }
  .hero-card .hero-sub { color: rgba(255,255,255,.82); font-size: 14px; }
  .hero-pills { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 16px; }
  .hero-pills .chip { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.18); color: #fff; backdrop-filter: blur(4px); }
  .count-badge {
    flex: none; text-align: center; margin-top: 2px;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2);
    border-radius: 16px; padding: 8px 12px; min-width: 64px; backdrop-filter: blur(6px);
  }
  .count-badge .cb-num { font-family: 'DM Sans', system-ui, sans-serif; font-size: 26px; font-weight: 700; line-height: 1; color: #fff; }
  .count-badge .cb-lbl { font-size: 9.5px; text-transform: uppercase; letter-spacing: .1em; color: rgba(255,255,255,.75); margin-top: 3px; }
  .count-badge.live { background: rgba(200,16,46,.34); border-color: rgba(255,255,255,.4); }

  /* progress / budget bar */
  .meter { height: 8px; border-radius: 6px; background: var(--card-soft); overflow: hidden; border: 1px solid var(--border); }
  .meter > i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--gold), var(--red)); transition: width .7s var(--ease); }

  /* category spend donut (spend page) */
  .donut-head { text-align: center; margin: 2px 0 2px; }
  .donut-head .dc-eyebrow { font-size: 10px; text-transform: uppercase; letter-spacing: .16em; color: var(--text-muted); }
  .donut-head .dc-amt { font-family: 'DM Sans', system-ui, sans-serif; font-size: 36px; font-weight: 700; color: var(--navy-text); line-height: 1.08; letter-spacing: -.01em; }
  .donut-head .dc-amt .dc-dec { font-size: .58em; color: var(--text-muted); font-weight: 600; }
  .donut-wrap { position: relative; width: 100%; max-width: 240px; aspect-ratio: 1 / 1; margin: 22px auto 16px; }
  .donut { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
  .donut .d-track { fill: none; stroke: var(--card-soft); stroke-width: 14; }
  .donut .d-seg { fill: none; stroke-width: 14; stroke-linecap: round;
    transition: stroke-dasharray 1s var(--ease); }
  .donut-center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .donut-center span { font-family: 'DM Sans', system-ui, sans-serif; font-size: 24px; font-weight: 700; color: var(--navy-text); letter-spacing: -.01em; }
  .donut-badge { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 3px; animation: badgePop .5s var(--ease) both; }
  .donut-badge .db-ic { width: 38px; height: 38px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); box-shadow: 0 6px 16px rgba(20, 28, 50, .16); display: flex; align-items: center; justify-content: center; color: var(--seg, var(--navy-text)); }
  .donut-badge .db-ic svg { width: 19px; height: 19px; }
  .donut-badge .db-lbl { font-size: 10.5px; font-weight: 600; color: var(--text-muted); white-space: nowrap; letter-spacing: -.01em; }
  .donut-badge .db-lbl b { font-weight: 600; opacity: .7; margin-right: 1px; }
  @keyframes badgePop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.5); } 60% { opacity: 1; } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  @media (prefers-reduced-motion: reduce) { .donut-badge { animation: none; } .donut .d-seg { transition: none; } }

  /* section heading */
  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 26px 2px 12px; }
  .section-head h2 { font-size: 26px; font-weight: 700; }
  .section-head .link { font-size: 13px; color: var(--gold); font-weight: 500; }

  /* tiles grid (overview shortcuts) */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--r-md);
    padding: 15px 15px 16px; box-shadow: var(--shadow-soft);
    transition: transform .16s var(--ease), box-shadow .16s; display: block;
  }
  .tile:active { transform: translateY(2px) scale(.985); }
  .tile .tile-ico { font-size: 22px; }
  .tile .tile-title { font-family: 'DM Sans', system-ui, sans-serif; font-size: 19px; font-weight: 600; color: var(--navy-text); margin-top: 8px; }
  .tile .tile-sub { font-size: 12px; color: var(--text-muted); margin-top: 1px; }

  /* "Book in Advance" cards */
  .book-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .book-card {
    display: flex; align-items: center; gap: 12px; padding: 12px 13px;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--r-md);
    box-shadow: var(--shadow-soft); transition: transform .16s var(--ease), border-color .16s;
  }
  .book-card:active { transform: scale(.98); }
  @media (hover: hover){ .book-card:hover { border-color: color-mix(in srgb, var(--gold) 55%, var(--border)); } }
  .book-card .bk-ic {
    width: 40px; height: 40px; flex: 0 0 auto; border-radius: 12px; display: grid; place-items: center;
    font-size: 20px; background: color-mix(in srgb, var(--gold) 14%, var(--card)); border: 1px solid var(--border);
  }
  .book-card .bk-body { flex: 1; min-width: 0; }
  .book-card .bk-label { font-family: 'DM Sans', system-ui, sans-serif; font-size: 14.5px; font-weight: 600; color: var(--navy-text); line-height: 1.2; }
  .book-card .bk-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  /* day list rows */
  .day-row {
    display: flex; align-items: center; gap: 14px; padding: 14px 16px;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--r-md);
    box-shadow: var(--shadow-soft); transition: transform .16s var(--ease), border-color .16s;
  }
  .day-row:active { transform: scale(.99); }
  .day-row.today { border-color: var(--red); box-shadow: 0 0 0 1px var(--red), var(--shadow-soft); }
  .day-row.past { opacity: .62; }
  .day-num {
    width: 46px; height: 46px; flex: 0 0 auto; border-radius: 13px;
    display: grid; place-items: center; background: var(--navy); color: #fff;
    font-family: 'DM Sans', system-ui, sans-serif; font-size: 22px; font-weight: 700;
  }
  [data-theme="dark"] .day-num { background: color-mix(in srgb, var(--gold) 22%, var(--card)); color: var(--navy-text); }
  .day-row.today .day-num { background: var(--red); }
  .day-row .dr-body { flex: 1; min-width: 0; }
  .day-row .dr-date { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
  .day-row .dr-title { font-family: 'DM Sans', system-ui, sans-serif; font-size: 19px; font-weight: 600; color: var(--navy-text); line-height: 1.15; margin: 1px 0 4px; }
  .day-row .dr-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .day-row .dr-tags span { font-size: 10.5px; color: var(--text-muted); }
  .day-row .dr-chev { color: var(--text-muted); font-size: 18px; flex: 0 0 auto; }
  .pill-today { font-size: 9.5px; background: var(--red); color: #fff; padding: 1px 7px; border-radius: 999px; text-transform: uppercase; letter-spacing: .06em; margin-left: 6px; vertical-align: middle; }

  /* ─── Day detail: timeline ─── */
  .detail-head { margin-bottom: 4px; }
  .detail-head .eyebrow { color: var(--gold); }
  .detail-head h1 { font-size: clamp(26px, 7vw, 36px); font-weight: 700; margin: 5px 0 6px; }
  .detail-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
  .timeline { position: relative; margin: 12px 0 0; padding-left: 2px; }
  .tl-item { position: relative; display: flex; gap: 14px; padding: 0 0 12px; }
  .tl-item:not(:last-child)::before {
    content:''; position: absolute; left: 62px; top: 10px; bottom: -2px; width: 2px;
    background: linear-gradient(var(--border), color-mix(in srgb, var(--border) 35%, transparent));
  }
  .tl-time { width: 42px; flex: 0 0 auto; text-align: right; font-size: 11.5px; font-weight: 600; color: var(--text-muted); padding-top: 13px; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .tl-dot {
    width: 14px; height: 14px; flex: 0 0 auto; margin-top: 11px; border-radius: 50%;
    background: var(--gold); z-index: 1; box-shadow: 0 0 0 4px var(--bg);
  }
  .tl-item.highlight .tl-dot { background: var(--red); box-shadow: 0 0 0 4px var(--bg), 0 0 0 7px color-mix(in srgb, var(--red) 22%, transparent); animation: dotPulse 2.4s var(--ease) infinite; }
  .tl-item.sleep .tl-dot { background: var(--navy-text); }
  @keyframes dotPulse {
    0%, 100% { box-shadow: 0 0 0 4px var(--bg), 0 0 0 7px color-mix(in srgb, var(--red) 22%, transparent); }
    50%      { box-shadow: 0 0 0 4px var(--bg), 0 0 0 11px color-mix(in srgb, var(--red) 6%, transparent); }
  }
  @media (prefers-reduced-motion: reduce) { .tl-item.highlight .tl-dot { animation: none; } }
  .tl-body {
    flex: 1; min-width: 0; background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 11px 14px; transition: border-color .15s, transform .12s;
  }
  .tl-item.highlight .tl-body {

/* ─── Storage: safe localStorage wrapper ─── */
class Storage {
  static get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  static set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  static getJSON(k,fb){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):fb; }catch(e){ return fb; } }
  static setJSON(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
}

/* ─── FX: live rates (CHF pivot) with offline fallback ─── */
class FX {
  constructor(){
    this.rates = Object.assign({}, FX_FALLBACK);
    this.live = false; this.fetchedAt = null;
    const c = Storage.getJSON('fx_cache', null);
    if(c && c.rates){ Object.assign(this.rates, c.rates); this.fetchedAt = c.at; this.live = true; }
    window.__fxRate = this.rates.AED || 4.67;
  }
  async refresh(){
    try {
      const r = await fetch('https://open.er-api.com/v6/latest/CHF');
      const d = await r.json();
      if(d && d.rates){
        const out = { CHF:1 };
        CURRENCIES.forEach(c => { if(d.rates[c]) out[c] = d.rates[c]; });
        Object.assign(this.rates, out);
        this.live = true; this.fetchedAt = Date.now();
        window.__fxRate = this.rates.AED || 4.67;
        Storage.setJSON('fx_cache', { rates:this.rates, at:this.fetchedAt });
        return true;
      }
    } catch(e){}
    return false;
  }
  convert(amt, from, to){
    const r = this.rates;
    if(r[from]==null || r[to]==null) return null;
    const chf = from==='CHF' ? amt : amt / r[from];
    return to==='CHF' ? chf : chf * r[to];
  }
}

/* ─── Trip model ─── */
class Trip {
  constructor(data){ Object.assign(this, data); this.days = this.days || []; }
  get dayCount(){ return this.days.length; }
  get start(){ return new Date(this.startDate + 'T00:00:00'); }
  get end(){ return new Date(this.endDate + 'T00:00:00'); }
  dayDate(i){ const d = new Date(this.start); d.setDate(d.getDate()+i); return d; }
  get todayIndex(){ const t = new Date(); t.setHours(0,0,0,0); return Math.round((t - this.start)/86400000); }
  get phase(){
    const ti = this.todayIndex;
    if(ti < 0) return { state:'before', n:Math.abs(ti) };
    if(ti < this.dayCount) return { state:'during', n:ti };
    return { state:'after' };
  }
}

/* ─── TripStore: load/seed/persist ─── */
class TripStore {
  constructor(){ this.trips = Storage.getJSON('trips_v1', null) || {}; this._seed(); this._repairIds(); }
  /* One-time repair: a past edit bug could re-slug a trip's `id` so it no longer
     matched its storage key (e.g. key "switzerland" holding id "switzerland-2"),
     which broke routes/expenses/checklist. The key is authoritative, so re-sync
     each trip's `id` back to its key. */
  _repairIds(){
    let dirty = false;
    for(const key of Object.keys(this.trips)){
      const t = this.trips[key];
      if(t && typeof t === 'object' && t.id !== key){ t.id = key; dirty = true; }
    }
    if(dirty) this.save();
  }
  _seed(){
    if(Object.keys(this.trips).length === 0){
      try {
        const seed = JSON.parse(document.getElementById('switzSeed').textContent);
        this.trips[seed.id] = seed; this.save();
        if(!Storage.get('active_trip')) Storage.set('active_trip', seed.id);
      } catch(e){}
    }
  }
  save(){ Storage.setJSON('trips_v1', this.trips); }
  list(){ return Object.keys(this.trips).map(id => new Trip(this.trips[id])); }
  get(id){ return this.trips[id] ? new Trip(this.trips[id]) : null; }
  activeId(){ const a = Storage.get('active_trip'); if(a && this.trips[a]) return a; const f = Object.keys(this.trips)[0]; return f || null; }
  setActive(id){ Storage.set('active_trip', id); }
  slug(name){
    let base = String(name||'trip').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40) || 'trip';
    let id = base, n = 2;
    while(this.trips[id]) id = base + '-' + (n++);
    return id;
  }
  add(obj){ const t = this.normalizeTrip(obj); this.trips[t.id] = t; this.save(); return t.id; }
  update(id, obj){ if(!this.trips[id]) return; this.trips[id] = obj; this.save(); }
  remove(id){ if(this.trips[id]){ delete this.trips[id]; this.save();
    Storage.set('expenses_'+id, ''); // best-effort cleanup
    if(Storage.get('active_trip')===id) Storage.set('active_trip', Object.keys(this.trips)[0]||''); } }
  /* Validate + clean an arbitrary object into a storable trip. Throws on bad data. */
  normalizeTrip(obj){
    if(!obj || typeof obj !== 'object') throw new Error('Not a trip object');
    const isDate = s => typeof s==='string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
    const name = String(obj.name||'').trim();
    if(!name) throw new Error('Trip needs a name');
    if(!isDate(obj.startDate)) throw new Error('startDate must be YYYY-MM-DD');
    if(!isDate(obj.endDate)) throw new Error('endDate must be YYYY-MM-DD');
    let id = (typeof obj.id==='string' && obj.id.trim()) ? obj.id.trim() : '';
    if(!id || (this.trips[id] && this.trips[id] !== obj)) id = this.slug(name);
    const days = Array.isArray(obj.days) ? obj.days.map(d=>{
      const timeline = Array.isArray(d&&d.timeline) ? d.timeline.map(s=>{
        const o = { time:String(s&&s.time||''), label:String(s&&s.label||'') };
        if(s&&s.note) o.note = String(s.note);
        if(s&&s.placeQuery) o.placeQuery = String(s.placeQuery);
        if(s&&s.kind) o.kind = String(s.kind);
        if(s&&s.bookLink && s.bookLink.url) o.bookLink = { label:String(s.bookLink.label||'Book'), url:String(s.bookLink.url) };
        const lat=Number(s&&s.lat), lon=Number(s&&s.lon);
        if(isFinite(lat) && isFinite(lon) && lat>=-90 && lat<=90 && lon>=-180 && lon<=180 && (s.lat!==undefined && s.lon!==undefined)){ o.lat=lat; o.lon=lon; }
        const si = (s&&s.stopInfo && typeof s.stopInfo==='object') ? this.cleanStopInfo(s.stopInfo) : undefined;
        if(si) o.stopInfo = si;
        return o;
      }) : [];
      // Auto-build a Google Maps directions link from the stops when none was supplied.
      let routeMapUrl = (d&&typeof d.routeMapUrl==='string' && d.routeMapUrl.trim()) ? d.routeMapUrl.trim() : undefined;
      if(!routeMapUrl){
        const pts = timeline.map(s=>s.placeQuery).filter(Boolean);
        if(pts.length>=2) routeMapUrl = 'https://www.google.com/maps/dir/' + pts.map(encodeURIComponent).join('/');
      }
      const dLat=Number(d&&d.lat), dLon=Number(d&&d.lon);
      const hasCentre = isFinite(dLat) && isFinite(dLon) && dLat>=-90 && dLat<=90 && dLon>=-180 && dLon<=180 && (d.lat!==undefined && d.lon!==undefined);
      const checklist = Array.isArray(d&&d.checklist) ? d.checklist.map(c=>String(c)).filter(c=>c.trim()) : undefined;
      const costs = Array.isArray(d&&d.costs) ? d.costs.map(x=>({ n:String(x&&x.n||'').trim(), c:Number(x&&x.c)||0 })).filter(x=>x.n) : undefined;
      return {
        title: String(d&&d.title||'Untitled day'),
        date: isDate(d&&d.date) ? d.date : undefined,
        town: (d&&typeof d.town==='string' && d.town.trim()) ? d.town.trim() : undefined,
        lat: hasCentre ? dLat : undefined,
        lon: hasCentre ? dLon : undefined,
        tags: Array.isArray(d&&d.tags) ? d.tags.map(String) : [],
        routeMapUrl,
        timeline,
        checklist: (checklist && checklist.length) ? checklist : undefined,
        costs: costs ? costs : undefined
      };
    }) : [];
    const hotels = Array.isArray(obj.hotels) ? obj.hotels.map(h=>({
      nights: String(h&&h.nights||'').trim(),
      name:   String(h&&h.name||'').trim(),
      loc:    String(h&&h.loc||'').trim(),
      url:    (h&&typeof h.url==='string' && /^https?:\/\//i.test(h.url)) ? h.url.trim() : ''
    })).filter(h=>h.name) : [];
    const bookings = Array.isArray(obj.bookings) ? obj.bookings.map(b=>({
      ico:   String(b&&b.ico||'').trim(),
      label: String(b&&b.label||'').trim(),
      url:   (b&&typeof b.url==='string' && /^https?:\/\//i.test(b.url)) ? b.url.trim() : ''
    })).filter(b=>b.label && b.url) : [];
    const prep = Array.isArray(obj.prep) ? obj.prep.map(sec=>({
      title: String(sec&&sec.title||'').trim(),
      items: Array.isArray(sec&&sec.items) ? sec.items.map((it,k)=>({
        id:   String(it&&it.id||'').trim() || ('item-'+k),
        text: String(it&&it.text||'').trim(),
        hint: String(it&&it.hint||'').trim()
      })).filter(it=>it.text) : []
    })).filter(sec=>sec.title && sec.items.length) : [];
    return {
      id, name,
      tagline: String(obj.tagline||'').trim(),
      startDate: obj.startDate, endDate: obj.endDate,
      travelers: parseInt(obj.travelers,10) || 1,
      baseCurrency: String(obj.baseCurrency||'CHF'),
      homeCurrency: String(obj.homeCurrency||'AED'),
      budget: Number(obj.budget)||0,
      tags: Array.isArray(obj.tags) ? obj.tags.map(String) : [],
      hotels,
      bookings,
      prep,
      days
    };
  }
  /* Keep only meaningful stopInfo pills (matches the AI JSON guide shape). */
  cleanStopInfo(si){
    const o = {};
    if(typeof si.parking==='string' && si.parking.trim()) o.parking = si.parking.trim();
    if(si.fee!==undefined){
      if(typeof si.fee==='number') o.fee = si.fee;
      else if(si.fee && typeof si.fee==='object' && si.fee.chf!=null) o.fee = { chf:Number(si.fee.chf), note:String(si.fee.note||'') };
    }
    if(typeof si.hours==='string' && si.hours.trim()) o.hours = si.hours.trim();
    if(typeof si.duration==='string' && si.duration.trim()) o.duration = si.duration.trim();
    if(typeof si.tip==='string' && si.tip.trim()) o.tip = si.tip.trim();
    return Object.keys(o).length ? o : undefined;
  }
  /* Build an empty trip skeleton with one blank day per date in the range. */
  blankTrip(meta){
    const t = this.normalizeTrip(Object.assign({ days:[] }, meta));
    const start = new Date(t.startDate+'T00:00:00'), end = new Date(t.endDate+'T00:00:00');
    const days = [];
    for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
      days.push({ title:'New day', date: window.isoLocal ? window.isoLocal(d) : d.toISOString().slice(0,10), tags:[], timeline:[] });
    }
    if(days.length) t.days = days;
    return t;
  }
}

/* ─── View base class ─── */
class View {
  constructor(app, params){ this.app = app; this.params = params || {}; this.title = 'Travel'; this.showBack = false; this.tab = null; this.level = 0; }
  build(){ const v = h('<section class="view"></section>'); v.innerHTML = this.render(); this.el = v; return v; }
  render(){ return ''; }
  mount(){}
  unmount(){}
}

/* ─── Router: hash routes + directional transitions ─── */
class Router {
  constructor(app){ this.app = app; this.routes = []; this.current = null; this.lastLevel = 0; window.addEventListener('hashchange', ()=>this.resolve()); }
  add(pattern, factory, level){
    const keys = [];
    const rx = new RegExp('^' + pattern.replace(/:[^/]+/g, m => { keys.push(m.slice(1)); return '([^/]+)'; }) + '$');
    this.routes.push({ rx, keys, factory, level: level||0 });
    return this;
  }
  go(path){ if(('#'+path) === location.hash) this.resolve(); else location.hash = path; }
  resolve(opts){
    let path = decodeURIComponent(location.hash.replace(/^#/, '')) || '/';
    let match = null, params = {}, def = null;
    for(const r of this.routes){
      const m = path.match(r.rx);
      if(m){ def = r; r.keys.forEach((k,i)=>params[k] = m[i+1]); match = true; break; }
    }
    if(!match){ location.hash = '/trips'; return; }
    const view = def.factory(params);
    view.level = def.level;
    let dir = view.level > this.lastLevel ? 'fwd' : (view.level < this.lastLevel ? 'back' : 'fade');
    // Staying inside the Map view (switching day chips) shouldn't replay the transition.
    if(this.current && this.current.tab==='map' && view.tab==='map') dir = 'none';
    else if(this.current){
      // Tab-to-tab: swipe in the direction of the tab bar, so it always matches the row.
      const TAB_ORDER=['overview','days','map','spend','convert'];
      const a=TAB_ORDER.indexOf(this.current.tab), b=TAB_ORDER.indexOf(view.tab);
      if(a!==-1 && b!==-1 && a!==b) dir = b>a ? 'fwd' : 'back';
      // Day-to-day navigation (same tab/level): swipe in the direction of travel.
      else if(dir==='fade' && this.current.params && view.params
              && this.current.params.n!=null && view.params.n!=null){
        const x=+this.current.params.n, y=+view.params.n;
        if(y>x) dir='fwd'; else if(y<x) dir='back';
      }
    }
    this.lastLevel = view.level;
    // Remember the current location so a cold app launch can restore it.
    try{ Storage.set('last_route', path); }catch(e){}
    this._render(view, (opts && opts.instant) ? 'none' : dir, opts);
  }
  _render(view, dir, opts){
    const keepScroll = !!(opts && opts.keepScroll);
    const prevY = keepScroll ? window.scrollY : 0;
    if(this.current && this.current.unmount) try{ this.current.unmount(); }catch(e){}
    const node = view.build();
    const outlet = document.getElementById('outlet');
    // Flush any in-flight transition before starting a new one. Rapid taps can leave
    // several view nodes mid-animation in the outlet; collapse them to just the most
    // recent (the real current view) so pages never stack/mix on top of each other.
    const kids = [...outlet.children];
    const oldNode = kids.length ? kids[kids.length - 1] : null;
    for(const k of kids){ if(k !== oldNode) k.remove(); }
    if(oldNode) oldNode.classList.remove('view-enter-fwd','view-enter-back','view-leave-fwd','view-leave-back','view-anim-fade');
    const swipe = (dir==='fwd' || dir==='back') && oldNode;
    if(swipe){
      // Two-phase swipe: old view slides off while the new view slides in.
      outlet.classList.add('swiping');
      oldNode.classList.add(dir==='fwd' ? 'view-leave-fwd' : 'view-leave-back');
      const drop = ()=>{ if(oldNode.parentNode) oldNode.remove(); if(outlet.children.length <= 1) outlet.classList.remove('swiping'); };
      oldNode.addEventListener('animationend', drop, { once:true });
      setTimeout(drop, 650);
      node.classList.add(dir==='fwd' ? 'view-enter-fwd' : 'view-enter-back');
      node.addEventListener('animationend', ()=>node.classList.remove('view-enter-fwd','view-enter-back'), { once:true });
      outlet.appendChild(node);
    } else {
      if(dir!=='none') node.classList.add('view-anim-fade');
      outlet.innerHTML = '';
      outlet.appendChild(node);
    }
    // Snap to top instantly on a fresh page (html has scroll-behavior:smooth,
    // which would otherwise animate the jump).
    if(keepScroll) window.scrollTo({ top: prevY, left: 0, behavior: 'instant' });
    else window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
    this.current = view;
    this.app.applyChrome(view);
    try{ view.mount(); }catch(e){ console.error(e); }
  }
}
